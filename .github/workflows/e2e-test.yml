name: E2E Tests

permissions:
  contents: read

# Same self-hosted-runner rationale as ci-build.yml: cancel a superseded PR run of this
# workflow, but never cancel one push run in favor of another (#670).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

on:
  workflow_dispatch:
  push:
    branches: [dotnet10]
    paths:
      - 'src/**'
      - 'demo/**'
      - 'test/e2e/**'
  pull_request:
    branches: [dotnet10]
    paths:
      - 'src/**'
      - 'demo/**'
      - 'test/e2e/**'

# Issue #885: the three legs below (baseline, killswitch, island — see each job's own
# comment for what it exercises) run one at a time via `needs:`, not as a matrix.
#
# This USED to be a single `e2e` job with `strategy.matrix.leg: [baseline, killswitch,
# island]`. #837 added the third ("island") leg, and the same day five distinct
# timing-sensitive failures surfaced across unrelated PRs (TC-33 viewport-outside-click,
# TC-04 screenshot timeout, TC-26 "Target crashed", a WorkFlow race test, a TOCTOU test) —
# all downstream of resource contention, not test-logic bugs. Measured on this host
# (2026-07-29, live workflow_dispatch runs): act_runner's Docker backend is capped at
# 4 CPU / 3.8GiB RAM (`docker info`) — independent of the Mac mini host's real 10 CPU /
# 16GB, because act_runner drives job containers through the Docker Desktop VM's own
# daemon (docker.sock bind-mount), not the host's. Two of the three legs' containers alone
# (each running a dotnet demo app process plus a headless Chromium instance) were observed
# using up to ~360% of the VM's 400% CPU budget and ~2.85GiB (~75%) of its 3.8GiB RAM
# within 30s of the run starting.
#
# The first fix attempt was `strategy.matrix.max-parallel: 1` on the single matrixed job.
# It had NO effect: a live re-run still started all three legs' containers within 6 seconds
# of each other. This is a known upstream internal CI gap, not a config mistake —
# go-gitea/gitea#35561 ("Cannot make steps run sequentially with matrix and
# max-parallel = 1"). `needs:` is a basic job-dependency-graph feature already used
# elsewhere in this repo's own workflows (ci-build.yml's security-scan needs
# build-and-test; mutation-gate.yml's mutants needs changes) and was verified in a live
# run to actually serialize execution, unlike max-parallel. See #885 for the full
# measurements and the two alternatives considered (per-test timing fixes, raising
# timeouts) and why concurrency was picked over both.
#
# Each downstream job carries `if: ${{ !cancelled() }}` so one leg failing doesn't skip
# the next — matching the matrix's old `fail-fast: false` (independent legs; every leg
# always gets a chance to run and report its own result) — WITHOUT also keeping the job
# alive through a cancellation the way `always()` would (cross-vendor review on PR #887
# caught this: job conditions are re-evaluated when the workflow is cancelled, e.g. by
# the concurrency block above on a superseded PR push, and `always()` stays true through
# that, silently defeating the concurrency group; `!cancelled()` does not). Measured
# cost: before-fix run 5835 (concurrent) took ~3m20s total; after-fix run 5837 (this
# needs:-chained version, live workflow_dispatch) took ~8m58s — roughly +5.5min, since
# the three legs no longer overlap at all (their durations now sum instead of
# overlapping).

env:
  # PEP 668: allow pip into the disposable runner container's system Python when setup-python degrades (issue #292)
  PIP_BREAK_SYSTEM_PACKAGES: "1"
  WTM_E2E_BASE_URL: http://localhost:52837
  WTM_E2E_HEADLESS: "true"
  WTM_E2E_TIMEOUT: "20000"
  WTM_E2E_REPORT: test/e2e/results/junit.xml

jobs:
  e2e-baseline:
    name: e2e (baseline)
    # Pinned to azure-overflow-runner via its ubuntu-24.04 label (#910).
    # local-runner labels: ubuntu-latest / ubuntu-22.04 / ubuntu-20.04.
    # azure-overflow-runner labels: ubuntu-latest / ubuntu-24.04 / ubuntu-22.04.
    # ubuntu-24.04 is the existing azure-only label, so no new label is needed;
    # ubuntu-latest or ubuntu-22.04 would keep the current random assignment
    # between local and azure.
    #
    # docker.gitea.com/runner-images:ubuntu-latest and :ubuntu-24.04 share the
    # same digest (sha256:58ea92624c7c09582e05594d95488331045053d3a3f34cf09649f2a32313a614)
    # and are pre-baked on the VM, so this is zero image change and no extra
    # pull — the job's environment is identical to what it gets today when it
    # randomly lands on azure.
    #
    # Why: not speed, predictability. Measured over 14 days, azure averages
    # ~14.3 min/round vs local's ~13.7 (close), but local's max hit 2374s
    # (baseline) and 8602s (island) because local-runner is capacity=2 inside
    # a 4 CPU / 4GiB Colima VM with two job containers competing, whereas
    # azure-overflow-runner is capacity=1 with 15GiB and runs one job at a
    # time, alone.
    #
    # Controller dependency: ~/.config/ci-runner-controller/controller.py's
    # START condition is `waiting_jobs > 0 and (local_busy or
    # azure_only_waiting > 0)`. The azure_only_waiting term was added
    # 2026-07-30 specifically so an azure-only-pinned job wakes the VM even
    # when the local runner is idle. If these three lines are later reverted
    # to ubuntu-latest, that controller term simply has no users — it does
    # not break.
    runs-on: ubuntu-24.04
    timeout-minutes: 45  # not enforced by this runner (job.timeout-minutes is ignored) -- real bound is the step-level timeout-minutes below; see docs/ci-operations.md
    env:
      WTM_E2E_KILLSWITCH: "0"
      UIOptions__UseSelectIslandRender: "false"
    steps:
      - uses: actions/checkout@v5
        timeout-minutes: 5

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v5
        timeout-minutes: 10
        with:
          dotnet-version: '10.0.x'

      - name: Build demo app
        run: dotnet build demo/WalkingTec.Mvvm.Demo/WalkingTec.Mvvm.Demo.csproj -c Release
        timeout-minutes: 10

      - name: Start demo app
        working-directory: demo/WalkingTec.Mvvm.Demo
        # This step only forks dotnet run into the background (`&`) and returns --
        # it does not wait on the demo process. timeout-minutes here bounds the
        # fork/redirect itself hanging before backgrounding, not app startup (that is
        # "Wait for demo to be ready" below, which already has its own timeout).
        timeout-minutes: 2
        env:
          WTM_E2E_KILLSWITCH: ${{ env.WTM_E2E_KILLSWITCH }}
          UIOptions__UseSelectIslandRender: ${{ env.UIOptions__UseSelectIslandRender }}
        run: |
          dotnet run -c Release --no-build \
            --urls http://0.0.0.0:52837 \
            -- --environment Development > "$GITHUB_WORKSPACE/demo-app.log" 2>&1 &
          echo "DEMO_PID=$!" >> $GITHUB_ENV

      - name: Wait for demo to be ready
        timeout-minutes: 5
        run: |
          echo "Waiting for demo app on port 52837..."
          for i in $(seq 1 90); do
            if curl -sf http://localhost:52837/Login/Login > /dev/null 2>&1; then
              echo "Demo app ready after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "Demo app did not start in 90s"
          exit 1

      - name: Show demo app log on readiness failure
        if: failure()
        timeout-minutes: 2
        run: |
          echo "---- tail -50 demo-app.log ----"
          tail -50 "$GITHUB_WORKSPACE/demo-app.log" || echo "demo-app.log not found"

      - name: Setup Python
        uses: actions/setup-python@v5
        timeout-minutes: 5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: test/e2e/requirements.txt

      - name: Install Python dependencies
        run: pip install -r test/e2e/requirements.txt
        timeout-minutes: 5

      - name: Install Playwright browsers
        run: playwright install chromium --with-deps
        timeout-minutes: 10

      - name: Run E2E tests (baseline)
        working-directory: test/e2e
        timeout-minutes: 30
        run: |
          python wtm_e2e_tests.py \
            --headless \
            --report results/junit.xml

      - name: Upload screenshots
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        timeout-minutes: 5
        with:
          name: e2e-screenshots-baseline
          path: test/e2e/screenshots/
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload JUnit XML report
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        timeout-minutes: 5
        with:
          name: e2e-junit-report-baseline
          path: test/e2e/results/junit.xml
          if-no-files-found: ignore
          retention-days: 30

  e2e-killswitch:
    name: e2e (killswitch)
    needs: e2e-baseline
    # !cancelled(), not always(): a job condition is re-evaluated when the workflow is
    # cancelled (e.g. a superseded PR run via the concurrency block above), and
    # always() stays true through a cancellation — so an always()-gated downstream job
    # would keep starting/running even after the run it belongs to was supposed to be
    # cancelled, defeating the concurrency group entirely. !cancelled() still runs this
    # job when the previous leg merely failed (preserving fail-fast: false's old
    # semantics — every leg still gets a chance to run and report), but stops once the
    # run itself is cancelled.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45  # not enforced by this runner (job.timeout-minutes is ignored) -- real bound is the step-level timeout-minutes below; see docs/ci-operations.md
    env:
      # Issue #681: second leg exercises the #627 legacy-script-rehydration kill-switch
      # (docs/csp-hardening.md). WTM_E2E_KILLSWITCH=1 is read by _Layout.cshtml to emit the
      # opt-in meta tag for THIS leg's demo process only — the baseline leg (and every
      # non-e2e run) is byte-identical to today. Runs a focused subset rather than the full
      # 36-check suite — most of TC-01..31 are direct-navigation/API checks with no
      # dialog-widget dependency and would just duplicate the baseline leg's signal. This
      # subset covers: a security smoke check (01), basic login/logout (06/07), the
      # full-page-load analysis panel (04, NOT routed through ff.OpenDialog so it's a
      # useful control showing the switch didn't break unrelated UI), structural CRUD
      # markup (26), and every #681-added dialog-driven check (32-36), which self-assert
      # kill-switch-aware expectations via the WTM_E2E_KILLSWITCH env var.
      WTM_E2E_KILLSWITCH: "1"
      UIOptions__UseSelectIslandRender: "false"
    steps:
      - uses: actions/checkout@v5
        timeout-minutes: 5

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v5
        timeout-minutes: 10
        with:
          dotnet-version: '10.0.x'

      - name: Build demo app
        run: dotnet build demo/WalkingTec.Mvvm.Demo/WalkingTec.Mvvm.Demo.csproj -c Release
        timeout-minutes: 10

      - name: Start demo app
        working-directory: demo/WalkingTec.Mvvm.Demo
        # This step only forks dotnet run into the background (`&`) and returns --
        # it does not wait on the demo process. timeout-minutes here bounds the
        # fork/redirect itself hanging before backgrounding, not app startup (that is
        # "Wait for demo to be ready" below, which already has its own timeout).
        timeout-minutes: 2
        env:
          WTM_E2E_KILLSWITCH: ${{ env.WTM_E2E_KILLSWITCH }}
          UIOptions__UseSelectIslandRender: ${{ env.UIOptions__UseSelectIslandRender }}
        run: |
          dotnet run -c Release --no-build \
            --urls http://0.0.0.0:52837 \
            -- --environment Development > "$GITHUB_WORKSPACE/demo-app.log" 2>&1 &
          echo "DEMO_PID=$!" >> $GITHUB_ENV

      - name: Wait for demo to be ready
        timeout-minutes: 5
        run: |
          echo "Waiting for demo app on port 52837..."
          for i in $(seq 1 90); do
            if curl -sf http://localhost:52837/Login/Login > /dev/null 2>&1; then
              echo "Demo app ready after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "Demo app did not start in 90s"
          exit 1

      - name: Show demo app log on readiness failure
        if: failure()
        timeout-minutes: 2
        run: |
          echo "---- tail -50 demo-app.log ----"
          tail -50 "$GITHUB_WORKSPACE/demo-app.log" || echo "demo-app.log not found"

      - name: Setup Python
        uses: actions/setup-python@v5
        timeout-minutes: 5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: test/e2e/requirements.txt

      - name: Install Python dependencies
        run: pip install -r test/e2e/requirements.txt
        timeout-minutes: 5

      - name: Install Playwright browsers
        run: playwright install chromium --with-deps
        timeout-minutes: 10

      - name: Run E2E tests (killswitch subset)
        working-directory: test/e2e
        timeout-minutes: 20
        run: |
          python wtm_e2e_tests.py \
            --tc 1,4,6,7,26,32,33,34,35,36 \
            --headless \
            --report results/junit.xml

      - name: Upload screenshots
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        timeout-minutes: 5
        with:
          name: e2e-screenshots-killswitch
          path: test/e2e/screenshots/
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload JUnit XML report
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        timeout-minutes: 5
        with:
          name: e2e-junit-report-killswitch
          path: test/e2e/results/junit.xml
          if-no-files-found: ignore
          retention-days: 30

  e2e-island:
    name: e2e (island)
    needs: e2e-killswitch
    # !cancelled(), not always() — same reasoning as e2e-killswitch above.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45  # not enforced by this runner (job.timeout-minutes is ignored) -- real bound is the step-level timeout-minutes below; see docs/ci-operations.md
    env:
      # Issue #837: third leg exercises the #470 island-render opt-in
      # (WtmUIOptions.UseSelectIslandRender, default OFF — demo's own appsettings.json
      # never sets it, so every e2e run before this leg only ever exercised the legacy
      # inline-script path across the whole #470/#567/#655 campaign). UIOptions__UseSelectIslandRender=true
      # is the standard ASP.NET Core double-underscore environment-variable convention for
      # the nested config key "UIOptions:UseSelectIslandRender" — for THIS leg's demo
      # process only. Same mechanism/shape as WTM_E2E_KILLSWITCH (a leg-scoped env var,
      # read via IConfiguration, with zero effect on any other leg or any non-e2e run), but
      # routed through the option's own already-documented, already-tested config path
      # (services.Configure<WtmUIOptions>(config.GetSection("UIOptions")) in
      # FrameworkServiceExtension.cs, the same binding UIOptionsSplitBrainTests.cs
      # exercises) rather than adding a second, parallel ad-hoc flag — no _Layout.cshtml or
      # Program.cs change needed. Runs the full suite (not a curated subset like
      # killswitch): UseSelectIslandRender's opt-in gates are spread across nearly every
      # LayUI TagHelper (grid, combobox, transfer, upload, tree, chart, date, color,
      # slider, richtext, submit button, panel, tab, search panel — see
      # .claude/rules/security-invariants.md and the TagHelper doc comments for the full
      # list), so a curated subset would defeat the point of adding this leg: making the
      # previously-unexercised state actually exercised, not narrowing it again.
      WTM_E2E_KILLSWITCH: "0"
      UIOptions__UseSelectIslandRender: "true"
    steps:
      - uses: actions/checkout@v5
        timeout-minutes: 5

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v5
        timeout-minutes: 10
        with:
          dotnet-version: '10.0.x'

      - name: Build demo app
        run: dotnet build demo/WalkingTec.Mvvm.Demo/WalkingTec.Mvvm.Demo.csproj -c Release
        timeout-minutes: 10

      - name: Start demo app
        working-directory: demo/WalkingTec.Mvvm.Demo
        # This step only forks dotnet run into the background (`&`) and returns --
        # it does not wait on the demo process. timeout-minutes here bounds the
        # fork/redirect itself hanging before backgrounding, not app startup (that is
        # "Wait for demo to be ready" below, which already has its own timeout).
        timeout-minutes: 2
        env:
          WTM_E2E_KILLSWITCH: ${{ env.WTM_E2E_KILLSWITCH }}
          UIOptions__UseSelectIslandRender: ${{ env.UIOptions__UseSelectIslandRender }}
        run: |
          dotnet run -c Release --no-build \
            --urls http://0.0.0.0:52837 \
            -- --environment Development > "$GITHUB_WORKSPACE/demo-app.log" 2>&1 &
          echo "DEMO_PID=$!" >> $GITHUB_ENV

      - name: Wait for demo to be ready
        timeout-minutes: 5
        run: |
          echo "Waiting for demo app on port 52837..."
          for i in $(seq 1 90); do
            if curl -sf http://localhost:52837/Login/Login > /dev/null 2>&1; then
              echo "Demo app ready after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "Demo app did not start in 90s"
          exit 1

      - name: Show demo app log on readiness failure
        if: failure()
        timeout-minutes: 2
        run: |
          echo "---- tail -50 demo-app.log ----"
          tail -50 "$GITHUB_WORKSPACE/demo-app.log" || echo "demo-app.log not found"

      - name: Setup Python
        uses: actions/setup-python@v5
        timeout-minutes: 5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: test/e2e/requirements.txt

      - name: Install Python dependencies
        run: pip install -r test/e2e/requirements.txt
        timeout-minutes: 5

      - name: Install Playwright browsers
        run: playwright install chromium --with-deps
        timeout-minutes: 10

      - name: Run E2E tests (island)
        working-directory: test/e2e
        timeout-minutes: 30
        run: |
          python wtm_e2e_tests.py \
            --headless \
            --report results/junit.xml

      - name: Upload screenshots
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        timeout-minutes: 5
        with:
          name: e2e-screenshots-island
          path: test/e2e/screenshots/
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload JUnit XML report
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        timeout-minutes: 5
        with:
          name: e2e-junit-report-island
          path: test/e2e/results/junit.xml
          if-no-files-found: ignore
          retention-days: 30
