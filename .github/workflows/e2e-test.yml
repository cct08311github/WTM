name: E2E Tests

on:
  workflow_dispatch:
  push:
    branches: [dotnet10]
    paths:
      - 'src/**'
      - 'demo/**'
      - 'test/e2e/**'
  pull_request:
    branches: [dotnet10]
    paths:
      - 'src/**'
      - 'demo/**'
      - 'test/e2e/**'

jobs:
  e2e:
    runs-on: ubuntu-latest
    env:
      WTM_E2E_BASE_URL: http://localhost:52837
      WTM_E2E_HEADLESS: "true"
      WTM_E2E_TIMEOUT: "20000"
      WTM_E2E_REPORT: test/e2e/results/junit.xml

    steps:
      - uses: actions/checkout@v5

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Build demo app
        run: dotnet build demo/WalkingTec.Mvvm.Demo/WalkingTec.Mvvm.Demo.csproj -c Release

      - name: Start demo app
        working-directory: demo/WalkingTec.Mvvm.Demo
        run: |
          dotnet run -c Release --no-build \
            --urls http://0.0.0.0:52837 \
            -- --environment Development &
          echo "DEMO_PID=$!" >> $GITHUB_ENV

      - name: Wait for demo to be ready
        run: |
          echo "Waiting for demo app on port 52837..."
          for i in $(seq 1 30); do
            if curl -sf http://localhost:52837/Login/Login > /dev/null 2>&1; then
              echo "Demo app ready after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "Demo app did not start in 30s"
          exit 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: test/e2e/requirements.txt

      - name: Install Python dependencies
        run: pip install -r test/e2e/requirements.txt

      - name: Install Playwright browsers
        run: playwright install chromium --with-deps

      - name: Run E2E tests
        working-directory: test/e2e
        run: |
          python wtm_e2e_tests.py \
            --headless \
            --report results/junit.xml

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: e2e-screenshots
          path: test/e2e/screenshots/
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload JUnit XML report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: e2e-junit-report
          path: test/e2e/results/junit.xml
          if-no-files-found: ignore
          retention-days: 30

