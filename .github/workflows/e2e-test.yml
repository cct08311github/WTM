name: E2E Tests

permissions:
  contents: read

# Same self-hosted-runner rationale as ci-build.yml: cancel a superseded PR run of this
# workflow, but never cancel one push run in favor of another (#670).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

on:
  workflow_dispatch:
  push:
    branches: [dotnet10]
    paths:
      - 'src/**'
      - 'demo/**'
      - 'test/e2e/**'
  pull_request:
    branches: [dotnet10]
    paths:
      - 'src/**'
      - 'demo/**'
      - 'test/e2e/**'

jobs:
  e2e:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Issue #681: second leg exercises the #627 legacy-script-rehydration
        # kill-switch (docs/csp-hardening.md). "killswitch" sets WTM_E2E_KILLSWITCH=1,
        # which _Layout.cshtml reads to emit the opt-in meta tag for THIS matrix leg's
        # demo process only — the "baseline" leg (and every non-matrix run) is
        # byte-identical to today. Both legs run the same suite: most TC-01..31 are
        # direct-navigation/API checks unaffected by the switch either way, and the
        # #681-added dialog-driven checks (tc_32+) branch their own assertions on
        # WTM_E2E_KILLSWITCH so neither leg produces a false failure.
        #
        # Issue #837: third leg exercises the #470 island-render opt-in
        # (WtmUIOptions.UseSelectIslandRender, default OFF — demo's own appsettings.json
        # never sets it, so every e2e run before this leg only ever exercised the legacy
        # inline-script path across the whole #470/#567/#655 campaign). "island" sets
        # UIOptions__UseSelectIslandRender=true — the standard ASP.NET Core
        # double-underscore environment-variable convention for the nested config key
        # "UIOptions:UseSelectIslandRender" — for THIS matrix leg's demo process only.
        # Same mechanism/shape as WTM_E2E_KILLSWITCH (a leg-scoped env var, read via
        # IConfiguration, with zero effect on any other leg or any non-e2e run), but
        # routed through the option's own already-documented, already-tested config path
        # (services.Configure<WtmUIOptions>(config.GetSection("UIOptions")) in
        # FrameworkServiceExtension.cs, the same binding UIOptionsSplitBrainTests.cs
        # exercises) rather than adding a second, parallel ad-hoc flag — no _Layout.cshtml
        # or Program.cs change needed. Runs the full suite (not a curated subset like
        # killswitch): UseSelectIslandRender's opt-in gates are spread across nearly every
        # LayUI TagHelper (grid, combobox, transfer, upload, tree, chart, date, color,
        # slider, richtext, submit button, panel, tab, search panel — see
        # .claude/rules/security-invariants.md and the TagHelper doc comments for the
        # full list), so a curated subset would defeat the point of adding this leg: making
        # the previously-unexercised state actually exercised, not narrowing it again.
        leg: [baseline, killswitch, island]
    env:
      # PEP 668: allow pip into the disposable runner container's system Python when setup-python degrades (issue #292)
      PIP_BREAK_SYSTEM_PACKAGES: "1"
      WTM_E2E_BASE_URL: http://localhost:52837
      WTM_E2E_HEADLESS: "true"
      WTM_E2E_TIMEOUT: "20000"
      WTM_E2E_REPORT: test/e2e/results/junit.xml
      WTM_E2E_KILLSWITCH: ${{ matrix.leg == 'killswitch' && '1' || '0' }}
      UIOptions__UseSelectIslandRender: ${{ matrix.leg == 'island' && 'true' || 'false' }}

    steps:
      - uses: actions/checkout@v5

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Build demo app
        run: dotnet build demo/WalkingTec.Mvvm.Demo/WalkingTec.Mvvm.Demo.csproj -c Release

      - name: Start demo app
        working-directory: demo/WalkingTec.Mvvm.Demo
        env:
          # Read by _Layout.cshtml via IConfiguration to opt this leg's demo process
          # into the #627 kill-switch meta tag. Explicitly re-declared here (rather
          # than relying on job-level env inheritance alone) so the intent is visible
          # at the point the ASP.NET Core process actually starts.
          WTM_E2E_KILLSWITCH: ${{ env.WTM_E2E_KILLSWITCH }}
          # #837: same reasoning — explicitly re-declared so it's visible at the point
          # the ASP.NET Core process starts. Binds into Configs.UIOptions.UseSelectIslandRender
          # via the standard ASP.NET Core environment-variable configuration provider
          # (double underscore -> nested key), the same "UIOptions" section
          # FrameworkServiceExtension.cs's services.Configure<WtmUIOptions>(...) binds from.
          UIOptions__UseSelectIslandRender: ${{ env.UIOptions__UseSelectIslandRender }}
        run: |
          dotnet run -c Release --no-build \
            --urls http://0.0.0.0:52837 \
            -- --environment Development > "$GITHUB_WORKSPACE/demo-app.log" 2>&1 &
          echo "DEMO_PID=$!" >> $GITHUB_ENV

      - name: Wait for demo to be ready
        run: |
          echo "Waiting for demo app on port 52837..."
          for i in $(seq 1 90); do
            if curl -sf http://localhost:52837/Login/Login > /dev/null 2>&1; then
              echo "Demo app ready after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "Demo app did not start in 90s"
          exit 1

      - name: Show demo app log on readiness failure
        if: failure()
        run: |
          echo "---- tail -50 demo-app.log ----"
          tail -50 "$GITHUB_WORKSPACE/demo-app.log" || echo "demo-app.log not found"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: test/e2e/requirements.txt

      - name: Install Python dependencies
        run: pip install -r test/e2e/requirements.txt

      - name: Install Playwright browsers
        run: playwright install chromium --with-deps

      - name: Run E2E tests (baseline)
        if: matrix.leg == 'baseline'
        working-directory: test/e2e
        run: |
          python wtm_e2e_tests.py \
            --headless \
            --report results/junit.xml

      - name: Run E2E tests (killswitch subset)
        if: matrix.leg == 'killswitch'
        working-directory: test/e2e
        # Issue #681: a focused subset rather than the full 36-check suite — most of
        # TC-01..31 are direct-navigation/API checks with no dialog-widget dependency
        # and would just duplicate the baseline leg's signal. This subset covers: a
        # security smoke check (01), basic login/logout (06/07), the full-page-load
        # analysis panel (04, NOT routed through ff.OpenDialog so it's a useful control
        # showing the switch didn't break unrelated UI), structural CRUD markup (26),
        # and every #681-added dialog-driven check (32-36), which self-assert
        # kill-switch-aware expectations via the WTM_E2E_KILLSWITCH env var.
        run: |
          python wtm_e2e_tests.py \
            --tc 1,4,6,7,26,32,33,34,35,36 \
            --headless \
            --report results/junit.xml

      - name: Run E2E tests (island)
        if: matrix.leg == 'island'
        working-directory: test/e2e
        # Issue #837: full suite, not a curated subset — see the matrix comment above for
        # why (UseSelectIslandRender's opt-in gates are spread across nearly every LayUI
        # TagHelper, unlike killswitch's narrow CSP-only surface). No wtm_e2e_tests.py
        # check currently branches its own assertions on this flag the way the #681
        # dialog checks (32-36) branch on WTM_E2E_KILLSWITCH — this leg's job is to make
        # the island-render path exercised at all, per #837's fixture-first mandate;
        # island-render-aware assertions are follow-up work, not something this leg's
        # first run is expected to have solved.
        run: |
          python wtm_e2e_tests.py \
            --headless \
            --report results/junit.xml

      - name: Upload screenshots
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: e2e-screenshots-${{ matrix.leg }}
          path: test/e2e/screenshots/
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload JUnit XML report
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: e2e-junit-report-${{ matrix.leg }}
          path: test/e2e/results/junit.xml
          if-no-files-found: ignore
          retention-days: 30

