name: Mutation Gate

# Issue #834: proves a security fix's tests actually detect the guard they claim to
# guard, by applying a repository-owned mutant patch and machine-checking that the
# designated test goes red for the expected reason. See test/mutants/entries/*.json
# (one file per mutant -- test/mutants/manifest.json holds only shared registry
# metadata, issue #854) and test/mutants/run_mutant.py for the full mechanism and
# rationale.
#
# HISTORY: as originally filed for issue #834, the seed mutant
# (mvc004-blocklist-empty-http-blindspot) was EXPECTED to survive against
# MvcAuthHolesTests.cs:274/297/320 -- those tests used a ListVM and a fake id, so they
# could not detect the guard's absence, and this job's own failure was the
# demonstration issue #834 asked for. Issue #837 (PR #845, merged as f148a1383) fixed
# that fixture; every "security" mutant under test/mutants/entries/ is now expected
# to report KILLED, and this workflow is a required status check on dotnet10 (see
# each entry file's own description for what changed and why). A red run here now
# means a real regression -- either a security guard was weakened, or a test that
# used to detect it stopped being able to -- not a known, accepted gap. Do not "fix"
# a red run by loosening a mutant entry, the runner, or an existing test; open an
# issue on whatever guard or test actually regressed.
#
# Also note (see CLAUDE.md "CI red does not mean failed"): actions/upload-artifact@v4
# is incompatible with this Gitea Actions server and can flip a job's conclusion to
# failure even when every step it ran genuinely succeeded (issue #11). The artifact
# upload steps below are `continue-on-error: true` and `if: always()` specifically so
# that quirk can never be the reason THIS job is red -- when in doubt, read the
# "MUTANT ... VERDICT" / "GATE: PASS|FAIL" lines a step prints, not the badge.
#
# NOTE ON SHAPE: an earlier version of this workflow used a `discover` job that read
# test/mutants/manifest.json and fanned mutant ids out into a matrix via
# `fromJson(needs.discover.outputs.*)`. On this repo's Gitea act_runner that matrix
# never expanded -- both a flat string array (`matrix.mutant_id`) and an array of
# objects (`matrix.entry`) resolved to an empty string for every leg, so every job
# "ran" against mutant id '' and failed for the wrong reason (caught only because
# run_mutant.py itself rejects an unknown/empty id). Rather than trust matrix
# expansion via cross-job JSON outputs on this runner again, each job below discovers
# entries directly and loops over ids with a plain bash `while read` loop in a
# single step. One job that iterates and can be read straight out of its own log is
# strictly better here than N matrix legs that can silently no-op.

on:
  workflow_dispatch:
  # NOT path-filtered, not even with paths-ignore, on EITHER trigger below. This
  # workflow's "gate" job is a required status check (issue #834 rule #7): ANY filter
  # at the trigger level -- an allowlist of paths, or a docs-only paths-ignore --
  # means the workflow does not run at all for a PR/push outside that set, "gate"
  # never posts a status, and Gitea (like GitHub) shows the required context as
  # permanently "expected, waiting" and blocks the merge button forever. A docs-only
  # PR hit exactly this with the paths-ignore version of this trigger (would have hung
  # #838/#844). The `push` trigger used to carry its own hardcoded `paths:` allowlist
  # (only `_FrameworkController.cs` and `test/mutants/**`) that suffered the mirror-
  # image failure: a push to dotnet10 touching only a *different* registered mutant's
  # target file -- e.g. the #830 review round's demo FileApiController.cs, which this
  # allowlist did not know about -- would never even trigger the workflow, so a future
  # regression against that file could not be caught post-merge either (a review
  # finding on PR #850, before this comment). Both triggers must always fire;
  # path-based cost control instead happens inside the workflow (see the `changes`
  # job below, which derives its allowlist from test/mutants/entries/*.json itself
  # rather than hardcoding a second, driftable copy), where a job that determines
  # "nothing gated changed" can still let `gate` post a real, unconditional success.
  pull_request:
    branches: [ dotnet10 ]
  push:
    branches: [ dotnet10 ]

permissions:
  contents: read

concurrency:
  group: mutation-gate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Cheap, unconditional (no path filter, no `if:`) cost-control gate for the two
  # expensive jobs below. Computes, PER ENTRY, whether the PR touched anything that
  # entry's own declarations make relevant to it; `mutants` runs only the SELECTED
  # subset, `meta-selftest` is skipped (not run) only when nothing at all was
  # selected, so a docs-only or unrelated-code PR is not taxed with a full dotnet
  # build per entry just to let the required check post a status.
  #
  # issue #968: entries grew linearly (30-35 -> 45 -> 61 in this file's own comment
  # history below) while `mutants` used to run EVERY kind=='security' entry on EVERY
  # pull_request -- so its step-level timeout-minutes needed hand-recomputing every
  # time the count grew, and drifted stale twice already. Per-entry selection (see
  # test/mutants/gate_lib.py's `select` subcommand) replaces "run everything, sized
  # for the worst case, every PR" with "run what THIS diff touches"; a push to
  # dotnet10 still runs the FULL set unconditionally as a post-merge backstop (not
  # gated on relevance at all -- see the `mutants` job below), so an entry a PR's own
  # selection correctly skipped is not permanently unexercised. This REDUCES coverage
  # PER PR BY DESIGN -- a PR's own gate run only proves the entries selected for that
  # PR's diff, not the whole registry; full-registry coverage is restored on every
  # merge to dotnet10, not on every PR.
  #
  # Fails OPEN toward "select everything" (run the real gate) whenever the diff can't
  # be computed for any reason -- an unexpected event payload, a missing SHA, a git
  # error. The two failure directions here are not symmetric: a wrongly-skipped real
  # mutant run is a silent security-gate regression; a wrongly-run mutant job on an
  # unrelated PR only costs a few minutes of CI time. Default to the safe, expensive
  # answer, never to the cheap, unsafe one. The ONE case that does NOT fail open: a
  # selection that computes EMPTY must not silently pass as "nothing to do" unless
  # gate_lib.py's own relevance_self_check() positive control also confirms the
  # relevance machinery itself is still working -- see the "Determine..." step below
  # and gate_lib.py's `select` subcommand for exactly how "0 selected, diff genuinely
  # touches nothing" is told apart from "0 selected, relevance computation is broken"
  # (the latter is a hard CI failure, never a masked pass -- #968's whole point is
  # that those two must never read the same, the same defect class as issue #855
  # defect 4 one level up: an entry that exists but never executed must never be a
  # silent pass).
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 10  # not enforced by this runner (job.timeout-minutes is ignored) -- real bound is the step-level timeout-minutes below; see docs/ci-operations.md
    outputs:
      has_selection: ${{ steps.check.outputs.has_selection }}
      selected_security_count: ${{ steps.check.outputs.selected_security_count }}
      selected_selftest_count: ${{ steps.check.outputs.selected_selftest_count }}
      total_security_entries: ${{ steps.check.outputs.total_security_entries }}
    steps:
    - uses: actions/checkout@v5
      timeout-minutes: 5
      with:
        fetch-depth: 0
    # #924: `source`/`.` applied directly to a bare-token file makes the shell execute the
    # token as a command; the resulting "command not found: <token>" prints the plaintext
    # token to stdout/CI logs. That is how a token leaked on 2026-07-11. Every site that
    # reads ~/.gitea-token must extract it with scripts/resolve-gitea-token.py (or the
    # equivalent `grep -oE '[a-f0-9]{40}'` for one-off interactive troubleshooting) instead
    # of sourcing it.
    #
    # This step lives in `changes`, not ci-build.yml's release-tooling-test job, on
    # purpose: ci-build.yml's trigger carries `paths-ignore: docs/**, **/*.md, .claude/**,
    # .gitea/**` on both push and pull_request (accepted policy #670 -- a docs-only PR gets
    # no ci-build statuses at all), and three of the six sites this issue fixed live under
    # docs/. `changes` is this repo's one job with NO path filter at all on either trigger
    # (see the `on:` block above and this job's own header comment) -- it is guaranteed to
    # run for a docs-only PR, which is exactly the shape most likely to reintroduce this.
    # Placed before "Determine whether a gated path changed" so a guard failure exits
    # before that step sets `has_selection`/`selected_security_count`; with those
    # outputs empty, `mutants`/`meta-selftest` (gated on
    # `needs.changes.outputs.has_selection == 'true'`) correctly skip instead of
    # running an expensive build the run has already failed. `gate`'s own is_ok()
    # check treats a `changes` job failure as FAIL, not skipped, so this still fails
    # the required check (see that job's summary step).
    #
    # The scan itself lives in scripts/check-gitea-token-not-sourced.py, not inline here,
    # because the rule needs to strip backtick-delimited inline code spans before matching
    # (so prose that documents/warns about the forbidden command in backticks is exempt,
    # uniformly, without a maintained per-file path exclusion list) -- expressing that in a
    # single `git grep` ERE isn't practical. See that script's own docstring for the full
    # rule, its exit codes (0 clean / 1 violation / 2 scanner error -- distinct so a scanner
    # failure can never read as a clean tree), and what it deliberately does not catch
    # (dynamic indirection: a path built at runtime, an alias, string concatenation). Its
    # exit code becomes this step's exit code directly -- no `if cmd; then fail; fi` shell
    # wrapper to get backwards.
    - name: "Guard: never source a gitea-token file (#924)"
      run: python3 scripts/check-gitea-token-not-sourced.py
      timeout-minutes: 3
    # #931 (cross-vendor review of #923's own JWT weak-key fix): #923 fixed the demo
    # appsettings.json values that shipped a padded/known-weak SecurityKey, but the same
    # review found four more fixed 32+-byte SecurityKey literals still in the tree -- three
    # of them added BY #923's own commits -- plus a repo-wide sweep for the same pattern
    # (this repo's own security posture: a confirmed issue class gets a full-codebase sweep,
    # not just the reported instances) found three more pre-existing ones. `test/` is NOT
    # excluded from the public GitHub mirror sync (.sync/github-excludes.txt), so a
    # test-fixture literal is exactly as public as a demo config value once it lands on
    # dotnet10. This step lives in `changes` for the identical reason the gitea-token guard
    # above does: no path filter on either trigger means it is guaranteed to run even for a
    # docs-only PR, which is exactly the shape most likely to reintroduce a stray literal
    # unreviewed.
    #
    # The scan itself lives in scripts/check-jwt-key-literal-blocklisted.py, not inline
    # here, because it cross-checks matches against JwtOption.KnownPublicKeys' own
    # `baseKeys` array (extracted directly from JwtOptions.cs at scan time -- deliberately
    # not a second, hand-maintained Python copy of the same list, see issue #855 defect 5).
    # See that script's own docstring for the full rule, its exit codes (0 clean / 1
    # violation / 2 scanner error -- distinct so a scanner failure can never read as a clean
    # tree), and what it deliberately does not catch (a literal assigned to an intermediate
    # variable and used indirectly). Its exit code becomes this step's exit code directly.
    - name: "Guard: no unblocklisted fixed JWT signing-key literal >= 32 bytes (#931)"
      run: python3 scripts/check-jwt-key-literal-blocklisted.py
      timeout-minutes: 3
    # #931 follow-up: two mutant entry files were committed containing an invalid JSON
    # escape (`\'`, a bash single-quote-escaping idiom pasted verbatim from console
    # output instead of being reduced to the one character it represents). run_mutant.py's
    # discover_entries() correctly refused to proceed -- reporting zero mutants run rather
    # than a false pass (#855 defect 4's own protection) -- but it aborts on the FIRST
    # broken file, so a CI run only ever names one problem at a time; a contributor fixes
    # it, reruns, and discovers the next one a full CI round later. This step lives here,
    # not only inside `mutants`/`meta-selftest` where discover_entries() runs for real,
    # because `changes` has no path filter and always runs, and because failing here (cheap,
    # no dotnet build) is strictly better than failing inside the expensive jobs downstream
    # for the identical reason.
    #
    # The scan itself lives in scripts/check-mutant-entries-parse.py, not inline here,
    # because it mirrors discover_entries()'s exact four checks (parses as JSON, has a
    # non-empty 'id', 'id' matches the filename, 'kind' is valid) while collecting every
    # failing file instead of stopping at the first -- see that script's own docstring for
    # the concrete incident that motivated it, its exit codes, and its stated scope (it does
    # NOT replicate run_mutant.py's patch/test-execution validation, which needs an actual
    # dotnet build and belongs downstream). Its exit code becomes this step's exit code
    # directly.
    - name: "Guard: every mutant entry file parses and validates (#931)"
      run: python3 scripts/check-mutant-entries-parse.py
      timeout-minutes: 3
    # #926 cross-vendor review, finding 7 follow-up (2026-07-31): the honest-denominator
    # coverage audit (scripts/audit-workflow-timeouts.py) was committed but never wired
    # into any workflow -- it would report 92/92 forever and silently drift the moment a
    # future step landed without its own timeout-minutes, which is the exact condition
    # that produced issue #926 in the first place. A script that proves a property but
    # never runs proves nothing on the next PR. This step lives in `changes`, not
    # ci-build.yml, for the identical reason the three guards above do: ci-build.yml's
    # trigger carries `paths-ignore: docs/**, **/*.md, .claude/**, .gitea/**`, so a PR
    # that only touches `.github/workflows/**` -- exactly the shape a timeout regression
    # arrives in -- might never run it there. `changes` has no path filter on either
    # trigger and is guaranteed to run.
    #
    # The scan itself lives in scripts/audit-workflow-timeouts.py, not inline here, for
    # the same reason as the other three: see its own docstring for the full rule (every
    # `run:`/`uses:` step across every workflow file must declare its own
    # timeout-minutes, with a single named, reasoned file-level exclusion for
    # publish-nuget.yml while PR #937 restructures it), its exit codes (0 clean / 1
    # missing timeout / 2 scanner error), and its EXEMPT_STEPS mechanism for the day a
    # step genuinely cannot carry one. Its exit code becomes this step's exit code
    # directly. This step itself is one of the steps the script counts -- it declares its
    # own timeout-minutes below like every other step in scope, so the audit's PASS
    # includes proving it is not exempting itself.
    - name: "Guard: every real-work workflow step declares its own timeout-minutes (#926)"
      run: python3 scripts/audit-workflow-timeouts.py
      timeout-minutes: 3
    # #917: this repo's e2e suite has repeatedly reported PASS when the thing under
    # test was broken -- 12 sites swallowed an exception and passed unconditionally
    # (#898), three security-themed TCs asserted nothing at all (#905), and #886's own
    # fix for a DIFFERENT swallowing bug made a zero-tests-executed abort read as
    # "Total: 0 | FAIL: 0 | ERROR: 0", satisfying this repo's own CI-reading rule.
    # #898/#905 fixed the individual instances by hand; this guard exists to catch the
    # CLASS mechanically, on every PR, so the next instance doesn't wait for someone to
    # notice a green run that proved nothing. This is an ABSOLUTE rule, not a ratchet
    # (2026-07 design review): no baseline file, no exemption list, no frozen violation
    # count -- a count-based ratchet has a swap hole (delete one old violation, add one
    # new, count unchanged) and this repo's own coverage ratchet has already shown a
    # manually-raised threshold just stagnates. This step lives in `changes`, not
    # e2e-test.yml, for the identical reason the four guards above do: e2e-test.yml only
    # triggers on `src/**`, `demo/**`, `test/e2e/**` changes, and a lint that scans
    # `test/e2e/wtm_e2e_tests.py` needs to run on every PR that COULD touch it, not only
    # ones e2e-test.yml's own path filter happens to catch. `changes` has no path filter
    # on either trigger and is guaranteed to run.
    #
    # The scan itself lives in scripts/check-e2e-test-integrity.py, not inline here --
    # it AST-parses (never imports) test/e2e/wtm_e2e_tests.py and checks: every
    # registered TC has its own assert (or matches tc_36's structural
    # docstring+`raise TestSkipped(...)` exemption, matched by shape, not by name); no
    # exception handler that can catch AssertionError fails to re-raise with a bare
    # `raise` when its try's own body contains an assert (this is what would have
    # caught `except AssertionError: raise TestSkipped(...)` laundering a FAIL into a
    # SKIP); every top-level `tc_*` function is actually wired into TC_REGISTRY (the
    # e2e counterpart of #855 defect 4); and `assert <constant truthy>` is flagged
    # anywhere it appears. See that script's own module docstring for the full rule,
    # its exit codes (0 clean / 1 violation / 2 scanner error -- distinct so a scanner
    # failure can never read as a clean tree), and the bypasses it deliberately does
    # NOT catch (non-constant tautologies, a helper's assert not credited to its TC
    # caller, multi-level indirect swallowing, and an author editing this lint and its
    # own selftest in the same PR -- none of those have been observed in this repo;
    # the four checks above match every incident found so far).
    #
    # `--selftest` runs FIRST against embedded fixtures (no external files) covering a
    # zero-assert TC, a swallowed-assert handler, the AssertionError-laundered-into-
    # TestSkipped shape, an unregistered tc_* function, a clean fixture (the positive
    # control -- without it a lint that always exits 1 would pass every negative case
    # above), and unparseable input -- so the proof that this guard actually fires is
    # re-verified by machine on every PR, not asserted once in a PR body and left to
    # rot. `set -e` makes a selftest failure stop the step before the real scan runs;
    # the real scan's exit code becomes this step's exit code directly.
    - name: "Guard: e2e TCs can actually fail -- no zero-assert/swallowed/unwired TCs (#917)"
      run: |
        set -e
        python3 scripts/check-e2e-test-integrity.py --selftest
        python3 scripts/check-e2e-test-integrity.py
      timeout-minutes: 3
    # issue #968: test/mutants/_selftest/selftest_relevance_covers_tests_and_workflow.py
    # and selftest_kind_validation_and_accounting.py were both written for issue #855
    # (PR #858) and have been runnable ever since -- but neither was ever wired into
    # this or any other workflow. They proved their point once, on the PR that added
    # them, and then rotted: a regression in is_change_relevant()'s test-source/
    # workflow-file/test-project branches, or in discover_entries()'s kind validation /
    # discovered-vs-executed accounting, would NOT have failed any CI run. This step
    # closes that gap and, at the same time, wires in
    # selftest_select_relevant_entries.py -- the #968 selftest proving: a diff
    # touching a real entry's target_file selects that entry (and not an unrelated
    # one); a diff touching nothing gated selects zero; a diff touching the workflow
    # file selects every entry of a kind; relevance_self_check() passes against the
    # real registry AND fails the moment is_change_relevant() is broken (proving the
    # positive control has teeth, not just that it exists); the `select` CLI
    # subcommand distinguishes "0 selected, healthy" (exit 0) from "0 selected,
    # broken" (exit 2) for the identical diff; and `select --event-name push` always
    # returns the full set regardless of the (bogus, in the test) SHAs given.
    #
    # issue #973 (found on this PR's own first CI run): selftest_select_relevant_entries.py
    # also used to cover gate_lib.py's reconcile() function directly, but that function
    # proving itself correct said nothing about whether the `gate` job -- which has NO
    # checkout and never will (see that job's own header comment) -- could actually
    # invoke it. It could not; `gate` failed with "No such file or directory" even
    # though `changes`/`mutants`/`meta-selftest` all reported a fully reconciled 61/61.
    # selftest_gate_job_reconciliation.py closes THAT gap specifically: it extracts the
    # `gate` job's real "Summarize mutation gate result" script (never a hand-copied
    # duplicate) and runs it under match/shortfall/surplus/skip/failure scenarios
    # (issue #1001 added the surplus case when the reconciliation became asymmetric),
    # including from a directory with NO repository checked out at all -- the exact
    # condition that broke #973, reproduced on demand and now guarded against on
    # every PR.
    #
    # This step lives in `changes`, not inside `mutants`/`meta-selftest`/`gate` where
    # the real `select` calls and the real reconciliation happen, for the same reason
    # as the four guards above: `changes` has no path filter on either trigger and is
    # guaranteed to run, including for a PR that only touches this workflow file or
    # gate_lib.py itself -- exactly the shape most likely to reintroduce a selection or
    # reconciliation regression. Each script exits 0 on success, 1 on any failed case;
    # `set -e` makes the first failure stop this step before the real "Determine
    # whether a gated path changed" step below ever calls `select` for real against
    # unverified logic.
    - name: "Guard: mutation-gate entry selection fires correctly, positive control included (#968, #973)"
      run: |
        set -e
        python3 test/mutants/_selftest/selftest_kind_validation_and_accounting.py
        python3 test/mutants/_selftest/selftest_relevance_covers_tests_and_workflow.py
        python3 test/mutants/_selftest/selftest_select_relevant_entries.py
        python3 test/mutants/_selftest/selftest_gate_job_reconciliation.py
      timeout-minutes: 5
    - name: Determine whether a gated path changed
      id: check
      shell: bash
      timeout-minutes: 5
      env:
        EVENT_NAME: ${{ github.event_name }}
        BASE_SHA: ${{ github.event.pull_request.base.sha }}
        HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        PUSH_BEFORE: ${{ github.event.before }}
        PUSH_AFTER: ${{ github.event.after }}
      run: |
        set -uo pipefail

        # issue #968: total kind counts, for logging context and for the `gate` job's
        # selftest_count half of the selected-vs-executed reconciliation -- kind==
        # 'selftest' entries are never filtered by relevance (see the `select`
        # invocation below, which is only for kind=='security'), so their SELECTED
        # count is always their TOTAL count, on both pull_request and push.
        TOTAL_SECURITY="$(python3 test/mutants/gate_lib.py ids --kind security | grep -c . || true)"
        TOTAL_SELFTEST="$(python3 test/mutants/gate_lib.py ids --kind selftest | grep -c . || true)"
        echo "total_security_entries -> $TOTAL_SECURITY (kind=='selftest' total -> $TOTAL_SELFTEST, always fully selected)"
        echo "total_security_entries=$TOTAL_SECURITY" >> "$GITHUB_OUTPUT"
        echo "selected_selftest_count=$TOTAL_SELFTEST" >> "$GITHUB_OUTPUT"

        # issue #968: `select` computes the diff AND the selection decision itself
        # (see test/mutants/gate_lib.py's `select` subcommand and the module-level
        # comment above select_relevant_entries() for why this is the ONLY place that
        # relevance logic lives) -- push unconditionally selects the full kind=='security'
        # set (the post-merge backstop, never filtered, not even when the diff can't be
        # read), pull_request selects by per-entry relevance against the computed diff,
        # falling back to the full set if that diff can't be computed (issue #855's
        # original fail-open rule, preserved). `mutants` below re-derives this SAME
        # selection independently, from the SAME event/SHA inputs, rather than trusting
        # a value passed across a job boundary -- see the "NOTE ON SHAPE" comment at the
        # top of this file for why cross-job data on this runner is treated with
        # suspicion; the two independent computations are also what makes the `gate`
        # job's selected-vs-executed reconciliation meaningful rather than tautological.
        #
        # issue #1001: "SAME event/SHA inputs" is necessary but was not sufficient --
        # `select` resolves those SHAs against whatever commits THIS job's own checkout
        # actually has on disk (`git diff --name-only base_sha head_sha`, in
        # gate_lib.py's resolve_changed_files()). Matching env vars with a DIFFERENT
        # checkout depth still diverges: this job's `fetch-depth: 0` (below) makes
        # base_sha reachable so the diff resolves; `mutants`'/`meta-selftest`'s
        # checkouts must carry the same `fetch-depth: 0` or their copy of the "same"
        # inputs resolves against an incomplete history and fails open to "select
        # everything" instead. Checkout depth is part of this contract, not an
        # independent detail -- see the `mutants` job's checkout step for the incident
        # (PR #998) this was found from.
        if SELECTED_IDS="$(python3 test/mutants/gate_lib.py select --kind security \
            --event-name "$EVENT_NAME" --base-sha "$BASE_SHA" --head-sha "$HEAD_SHA" \
            --push-before "$PUSH_BEFORE" --push-after "$PUSH_AFTER")"; then
          :
        else
          SELECT_EXIT=$?
          if [ "$SELECT_EXIT" -eq 2 ]; then
            echo "::error::gate_lib.py select's relevance self-check FAILED (see the error printed above) -- a 0-selected result could not be trusted to mean 'this diff touches nothing gated' rather than 'relevance computation is broken'. issue #968: this must be a loud CI failure, never a silent zero-selected pass."
          else
            echo "::error::test/mutants/gate_lib.py select failed (exit $SELECT_EXIT) -- see the error printed above."
          fi
          exit 1
        fi

        SELECTED_COUNT="$(printf '%s\n' "$SELECTED_IDS" | grep -c . || true)"
        echo "selected_security_count=$SELECTED_COUNT" >> "$GITHUB_OUTPUT"
        if [ "$SELECTED_COUNT" -eq 0 ]; then
          echo "has_selection=false" >> "$GITHUB_OUTPUT"
          echo "0 of $TOTAL_SECURITY security-kind entries selected for this $EVENT_NAME -- this diff touches no gated path, and gate_lib.py's own relevance self-check (see stderr above) confirmed the selection machinery is still working. mutants/meta-selftest are skipped; gate treats this as a genuine PASS, not a masked no-op (issue #968)."
        else
          echo "has_selection=true" >> "$GITHUB_OUTPUT"
          echo "$SELECTED_COUNT of $TOTAL_SECURITY security-kind entries selected for this $EVENT_NAME:"
          printf '%s\n' "$SELECTED_IDS" | sed 's/^/  - /'
        fi

  # The gate itself: every SELECTED "security" mutant under test/mutants/entries/ must
  # be reported KILLED (patch applies in-scope, compiles, positive control stays
  # green, designated red test fails with the expected assertion message). Any other
  # verdict -- SURVIVED, UNEXPECTED_RED, a build failure, an out-of-scope patch, or a
  # broken positive control -- fails this job. All selected mutants run even after one
  # fails, so one mutant's result never hides another's; the loop tracks failures
  # itself instead of relying on `set -e` to stop at the first one.
  #
  # issue #968: "every" above means the SELECTED subset on a pull_request (per-entry
  # relevance against that PR's diff -- see test/mutants/gate_lib.py's `select`
  # subcommand) and the FULL, unconditional set on a push to dotnet10 (the post-merge
  # backstop). This job re-derives its own selection independently of `changes`
  # rather than trusting that job's output list directly (see the "Run every security
  # mutant" step below) -- the two independently-computed counts are what the `gate`
  # job's selected-vs-executed reconciliation cross-checks.
  #
  # Skipped (not failed) when the `changes` job selected nothing -- `gate` below
  # treats a skip here as a pass, not a failure, PROVIDED `changes` itself reported
  # has_selection=false rather than failing outright (see that job's own step for how
  # "0 selected, legitimately" is told apart from "0 selected, computation broken").
  mutants:
    needs: changes
    if: needs.changes.outputs.has_selection == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 135  # not enforced by this runner (job.timeout-minutes is ignored) -- real bound is the step-level timeout-minutes below; see docs/ci-operations.md. Kept >= the "Run every security mutant" step's own 125-minute budget plus this job's setup steps, purely for schema consistency -- see that step's comment for the derivation (issue #968: recomputed for 61 entries, was 100/90 for 45).
    outputs:
      security_count: ${{ steps.run.outputs.security_count }}
    env:
      # DOTNET_gcServer=0: use workstation GC instead of server GC. Server GC sizes its
      # heap budget against the WHOLE container (here: act_runner's 4 CPU / 3.8GiB Docker
      # VM), which is the primary driver of this job's OOM kills (issue #900) -- on a
      # push to dotnet10 (the unconditional full-set backstop) or a pull_request whose
      # selection happens to include every entry (e.g. it touches this workflow file or
      # test/mutants/ itself), this job evaluates every security-kind entry under
      # test/mutants/entries/ (currently 61 -- SECOND STALE-COMMENT WARNING, issue #968:
      # this used to read "currently 45", itself a correction of an even earlier "roughly
      # 30-35 mutant entries" (issue #926). Both times, the stale count is what let the
      # timeout below drift too tight for a legitimate WORST-CASE run -- #968 additionally
      # replaces "run every entry on every PR" with per-entry relevance selection (see
      # test/mutants/gate_lib.py's `select` subcommand) precisely so this recomputation
      # stops being needed on every registration PR, but the timeout below still has to
      # cover the worst case (a push, or a PR that selects everything), which is still
      # the FULL entry count.
      # Recount at any time with:
      #   python3 test/mutants/gate_lib.py ids --kind security | grep -c .
      # and re-derive that step's timeout-minutes from the new count using the formula in
      # its own comment -- do not let this number drift out of sync with reality again),
      # of which a small subset (currently 10, those targeting the demo tree under demo/)
      # additionally trigger the largest/most
      # expensive compiles (~2 Demo builds each, since evaluate_mutant() in
      # test/mutants/run_mutant.py builds the test project once for the clean baseline
      # and once more after the patch is applied). Across the whole job that's on the
      # order of dozens of dotnet builds back to back, and server GC's per-build peak is
      # much higher. Workstation GC has a much lower peak; the cost is 10-30% slower
      # compiles. Do NOT remove this to "speed up CI" without re-reading issue #900 --
      # removing it reintroduces the exact OOM-kill (csc exit 137) this workflow keeps
      # failing on.
      DOTNET_gcServer: "0"
      # UseSharedCompilation=false: disable the resident VBCSCompiler build server. With
      # it enabled, ONE compiler process stays resident across this job's dozens of
      # back-to-back builds (see the DOTNET_gcServer comment above for how that count
      # breaks down) and its heap high-water-mark accumulates across all of them instead
      # of being released between builds -- a second, independent contributor to the
      # same OOM kills (issue #900). Disabling it means each `csc` invocation starts
      # fresh and exits (releasing its memory) when done; the cost is ~1s extra startup
      # per compile. Do NOT remove this to "speed up CI" -- see issue #900 before
      # touching it.
      UseSharedCompilation: "false"
      # MSBUILDDISABLENODEREUSE=1: prevents MSBuild from leaving idle worker nodes
      # resident between invocations (the MSBuild-process analogue of the VBCSCompiler
      # problem above). Belt-and-suspenders alongside UseSharedCompilation=false -- keeps
      # this job's per-build memory footprint from accumulating across its dozens of
      # back-to-back builds (see the DOTNET_gcServer comment above). Do NOT remove this
      # to "speed up CI" -- see issue #900.
      MSBUILDDISABLENODEREUSE: "1"
    steps:
    # fetch-depth: 0 (issue #1001, found on PR #998): this job calls the SAME
    # `gate_lib.py select --kind security --base-sha --head-sha` the `changes` job
    # above already called with identical inputs -- but until this fix, `changes`
    # checked out full history (fetch-depth: 0, see that job's own checkout) while
    # THIS job used actions/checkout@v5's default shallow clone (fetch-depth: 1, base
    # commit absent). `select` calls resolve_changed_files(), which shells out to
    # `git diff --name-only base_sha head_sha`; on a shallow clone that git invocation
    # fails (base_sha unreachable), resolve_changed_files() catches the
    # CalledProcessError and returns None, and select's pre-existing fail-open rule
    # (issue #855, preserved by #968) then selects the FULL kind='security' set --
    # not because the diff was empty, but because it could not be computed at all.
    # `changes` (full history) computed the correct partial selection (30 on #998);
    # `mutants` (shallow) computed 68 (the full set); the `gate` job's
    # selected-vs-executed reconciliation below then failed on 30 != 68. See the
    # "NOTE ON SHAPE"/select-invocation comments further up this file for why the two
    # jobs deliberately re-derive the same selection independently rather than
    # trusting a value passed across the job boundary -- that independence is exactly
    # what requires both checkouts to see the same repository state, not just the
    # same env vars.
    - uses: actions/checkout@v5
      timeout-minutes: 5
      with:
        fetch-depth: 0
    - uses: actions/setup-dotnet@v5
      timeout-minutes: 10
      with:
        dotnet-version: '10.0.x'
    - uses: actions/setup-python@v5
      timeout-minutes: 5
      with:
        python-version: '3.12'
    # See ci-build.yml for the rationale on this cache shape (no packages.lock.json
    # committed, so setup-dotnet's built-in cache: option cannot be used).
    # continue-on-error + timeout-minutes: a cache-backend failure must only cost the
    # speedup, never fail the job -- but continue-on-error alone cannot catch a HANG,
    # only a returned error (#926).
    - name: Cache NuGet packages
      uses: actions/cache@v4
      continue-on-error: true
      timeout-minutes: 5
      with:
        path: ~/.nuget/packages
        key: ${{ runner.os }}-nuget-${{ hashFiles('Directory.Packages.props', '**/*.csproj') }}
        restore-keys: |
          ${{ runner.os }}-nuget-

    - name: Run every security mutant
      id: run
      shell: bash
      env:
        EVENT_NAME: ${{ github.event_name }}
        BASE_SHA: ${{ github.event.pull_request.base.sha }}
        HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        PUSH_BEFORE: ${{ github.event.before }}
        PUSH_AFTER: ${{ github.event.after }}
      # Budget derivation (issue #926 cross-vendor review finding #11; recomputed for
      # issue #968): this used to be a flat 55 minutes that did not scale with the
      # number of entries and was already tight even for the stale "30-35 entries"
      # estimate this comment once carried. run_mutant.py's evaluate_mutant() does 2
      # incremental builds + 3 filtered test runs per normal entry (baseline
      # build+test, patched build, green test, red test) -- measured at ~73s/entry on
      # an otherwise-idle host. This job forces workstation GC (DOTNET_gcServer=0
      # above) specifically because server GC's peak causes OOM kills under this
      # runner's 4 CPU / 3.8GiB co-tenancy (issue #900); the same env comment documents
      # that workstation GC costs 10-30% slower compiles as the tradeoff. THIS BUDGET
      # MUST COVER THE WORST CASE, not a typical selected-subset PR run: a push to
      # dotnet10 always runs the full set (the post-merge backstop, issue #968, not
      # conditional on anything), and a pull_request can also select every entry (its
      # diff touches this workflow file or test/mutants/ itself). At the current 61
      # security-kind entries (recount: `python3 test/mutants/gate_lib.py ids --kind
      # security | grep -c .`) and the WORST-CASE 30% slowdown:
      #   61 entries * 73s * 1.3 = 5788.9s = ~96.5 minutes
      # Adding the same ~25% headroom this budget has always carried, on top of the
      # ~96.5-minute worst-case estimate, without a live measured p95 (this repo's CI
      # cannot be triggered from this fix to obtain one):
      #   96.5 * 1.25 = ~120.6 minutes, rounded up to 125 for a little extra margin
      # This is a static budget re-derived from a documented formula, not an empirical
      # p95 -- if the entry count or the per-entry cost materially changes, recompute
      # entries * 73s * 1.3 / 60 * 1.25 and update both this value and the job-level
      # timeout-minutes above. issue #968 additionally reduces how OFTEN this worst
      # case is actually hit (most pull_requests now select far fewer than 61 entries)
      # but does NOT reduce what the budget itself has to cover -- do not let this
      # drift stale the way "30-35 entries" (then "45 entries") did.
      timeout-minutes: 125
      run: |
        set -o pipefail
        mkdir -p mutant-results

        # issue #968: mutant ids to run are SELECTED via
        # `python3 test/mutants/gate_lib.py select --kind security`, re-derived HERE
        # independently of the `changes` job's own selection (same event/SHA env vars,
        # same underlying selection logic -- see gate_lib.py's `select` subcommand and
        # its module-level comment for why per-entry selection is built ONLY on top of
        # is_change_relevant(), never a second implementation) rather than trusting a
        # value passed across the job boundary (see the "NOTE ON SHAPE" comment at the
        # top of this file). On push, this always resolves to the FULL kind=='security'
        # set (the post-merge backstop, unconditional). select's own exit code is
        # distinct for "computation failed outright" vs. "selected empty because the
        # relevance self-check failed" (exit 2) -- both are hard failures here; this
        # job only reaches an `if:` of has_selection=='true', so a HEALTHY empty
        # selection should never occur here at all (see the guard immediately below).
        if ! MUTANT_IDS="$(python3 test/mutants/gate_lib.py select --kind security \
            --event-name "$EVENT_NAME" --base-sha "$BASE_SHA" --head-sha "$HEAD_SHA" \
            --push-before "$PUSH_BEFORE" --push-after "$PUSH_AFTER")"; then
          echo "::error::Failed to select mutant ids (issue #968) -- see the error printed above (an empty entries directory, an entry file missing its id, an entry with an unrecognized kind -- issue #855 defect 4 -- or a failed relevance self-check)."
          exit 1
        fi

        # issue #968: this job only runs when `changes` reported has_selection=='true'
        # (at least one entry selected). An EMPTY MUTANT_IDS here therefore means this
        # job's own independent re-selection DISAGREES with what `changes` decided --
        # e.g. an event/SHA mismatch between the two jobs, or a non-deterministic bug
        # in the selection logic itself. That divergence must be a loud CI failure,
        # never a silent no-op run that reports a pass without evaluating anything
        # (mirrors issue #855 defect 4's own protection, one level up: "selected but
        # not executed" must never be silent).
        if [ -z "$MUTANT_IDS" ]; then
          echo "::error::No 'security' mutants were selected in THIS job, but it only runs when the changes job reported has_selection=true (i.e. it believed at least one entry should run). This divergence between what changes selected and what mutants independently re-selected must never be a silent pass. issue #968."
          exit 1
        fi

        echo "Selected security mutant ids:"
        echo "$MUTANT_IDS" | sed 's/^/  - /'
        echo

        # issue #968 (successor to issue #855 defect 4): this job's own count of ids it
        # is about to execute, consumed by the `gate` job's selected-vs-executed
        # reconciliation.
        SECURITY_COUNT="$(echo "$MUTANT_IDS" | grep -c .)"
        echo "security_count=$SECURITY_COUNT" >> "$GITHUB_OUTPUT"

        OVERALL_FAILED=0
        while IFS= read -r MUTANT_ID; do
          if [ -z "$MUTANT_ID" ]; then
            # Must never happen given the guard above, but if manifest parsing or
            # the loop itself ever produces a blank line, treat it exactly like the
            # original incident: a loud, hard failure, not a silently skipped mutant.
            echo "::error::Encountered an empty mutant id while iterating the manifest -- this must never be silently skipped."
            OVERALL_FAILED=1
            continue
          fi

          echo "=================================================="
          echo "Running mutant: $MUTANT_ID"
          echo "=================================================="
          mkdir -p "mutant-results/$MUTANT_ID"
          if python3 test/mutants/run_mutant.py \
              --mutant "$MUTANT_ID" \
              --trx-dir "mutant-results/$MUTANT_ID" \
              2>&1 | tee "mutant-results/$MUTANT_ID/console.log"; then
            echo "mutant '$MUTANT_ID': gate step passed"
          else
            echo "::error::mutant '$MUTANT_ID' did not pass the gate -- see mutant-results/$MUTANT_ID/console.log"
            OVERALL_FAILED=1
          fi
          echo
        done <<< "$MUTANT_IDS"

        if [ "$OVERALL_FAILED" -ne 0 ]; then
          echo "MUTATION_GATE_RESULT: FAIL"
          exit 1
        fi
        echo "MUTATION_GATE_RESULT: PASS"

    - name: Upload mutant artifacts (head SHA, diff, TRX, console log per mutant)
      uses: actions/upload-artifact@v4
      if: always()
      continue-on-error: true
      timeout-minutes: 5
      with:
        name: mutants
        path: mutant-results/

  # Meta test for the runner itself (issue #834 acceptance criterion): proves
  # run_mutant.py reports a non-compiling patch as an invalid mutant / gate FAILURE
  # and never as a pass. Uses --expect-verdict so this job asserts on the RUNNER's
  # correctness, not on any real security property -- it is intentionally a separate
  # job from `mutants` so a selftest fixture can never be mistaken for a real mutant
  # in the pass/fail decision, while still being required to be green itself: a green
  # meta-selftest is the load-bearing proof that an invalid mutant is never mistaken
  # for a pass.
  #
  # Skipped (not failed) when the `changes` job selected nothing -- `gate` below
  # treats a skip here as a pass, not a failure. issue #968: kind=='selftest' entries
  # are NEVER filtered by relevance (they test the RUNNER's own correctness, a
  # property that isn't tied to which files a diff touches, and there are only 6 of
  # them -- cheap enough that per-entry selection isn't worth the added complexity
  # here); this job always evaluates every one of them whenever it runs at all, on
  # both pull_request and push, unchanged from before #968.
  meta-selftest:
    # needs: [changes, mutants] -- this job used to declare `needs: changes` only, the
    # same as `mutants`, so both jobs were scheduled concurrently. That self-inflicted
    # co-tenancy was an independent contributor to the OOM kills documented in issue
    # #900: this Gitea act_runner has capacity 2, so mutants+meta-selftest running
    # together already consumes both runner slots, before counting any other
    # workflow's job that might also be scheduled onto local-runner at the same time.
    # Adding `mutants` here serializes meta-selftest to start only after mutants
    # finishes, removing that specific co-tenancy at the cost of roughly 3 more
    # minutes of total wall-clock -- the same tradeoff PR #887 already made for
    # e2e-test.yml's matrix legs (see docs/ci-operations.md ~lines 199-221), because
    # Gitea silently ignores `strategy.matrix.max-parallel` there just as it would
    # ignore any other parallelism cap here. The `if:` below is unchanged in shape --
    # it still reads only needs.changes.outputs.has_selection (renamed from
    # `relevant` by issue #968), not needs.mutants.
    needs: [changes, mutants]
    if: needs.changes.outputs.has_selection == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15  # not enforced by this runner (job.timeout-minutes is ignored) -- real bound is the step-level timeout-minutes below; see docs/ci-operations.md
    outputs:
      selftest_count: ${{ steps.run.outputs.selftest_count }}
    env:
      # DOTNET_gcServer=0: use workstation GC instead of server GC. Server GC sizes its
      # heap budget against the WHOLE container (here: act_runner's 4 CPU / 3.8GiB Docker
      # VM), which is the primary driver of this job's OOM kills (issue #900) -- this job
      # runs the mutation gate's own 6 selftest fixtures (see `python3
      # test/mutants/gate_lib.py selftests`), always in full -- a much smaller scale than
      # the mutants job's 30+ entries, and not every fixture even reaches a dotnet build
      # (three of the six are pure manifest-validation checks -- empty red_tests, an
      # overbroad assertion pattern, an out-of-scope patch -- that are rejected in
      # test/mutants/run_mutant.py's evaluate_mutant() before any build runs at all), but
      # the fixtures that do reach a build still build the same test project the mutants
      # job builds, so server GC's higher per-build peak is still worth avoiding here.
      # Workstation GC has a much lower peak; the cost is 10-30% slower compiles. Do NOT
      # remove this to "speed up CI" without re-reading issue #900 -- removing it
      # reintroduces the exact OOM-kill (csc exit 137) this workflow keeps failing on.
      DOTNET_gcServer: "0"
      # UseSharedCompilation=false: disable the resident VBCSCompiler build server. With
      # it enabled, ONE compiler process stays resident across this job's builds (see the
      # DOTNET_gcServer comment above -- 6 selftest fixtures, not every one of which
      # reaches a build) and its heap high-water-mark accumulates across all of them
      # instead of being released between builds -- a second, independent contributor to
      # the same OOM kills (issue #900). Disabling it means each `csc` invocation starts
      # fresh and exits (releasing its memory) when done; the cost is ~1s extra startup
      # per compile. Do NOT remove this to "speed up CI" -- see issue #900 before
      # touching it.
      UseSharedCompilation: "false"
      # MSBUILDDISABLENODEREUSE=1: prevents MSBuild from leaving idle worker nodes
      # resident between invocations (the MSBuild-process analogue of the VBCSCompiler
      # problem above). Belt-and-suspenders alongside UseSharedCompilation=false -- keeps
      # this job's per-build memory footprint from accumulating across its builds (see
      # the DOTNET_gcServer comment above -- 6 selftest fixtures). Do NOT remove this to
      # "speed up CI" -- see issue #900.
      MSBUILDDISABLENODEREUSE: "1"
    steps:
    # fetch-depth: 0 (issue #1001), for consistency with `changes` and `mutants`
    # above -- DEFENSIVE, not a fix for an observed bug in THIS job: kind=='selftest'
    # entries are never filtered by relevance (see `gate_lib.py select`'s selftests
    # discovery, which is unconditional) and this job's own selftest_count is always
    # compared against `changes`' selected_selftest_count, which is always the FULL
    # selftest total on every event -- so a shallow clone here never produced the
    # wrong count (6 == 6 always matched, even before this fix). Kept at fetch-depth:
    # 0 anyway so this job's checkout depth cannot silently drift from the other two
    # and become a real bug the next time this job's selection logic changes.
    - uses: actions/checkout@v5
      timeout-minutes: 5
      with:
        fetch-depth: 0
    - uses: actions/setup-dotnet@v5
      timeout-minutes: 10
      with:
        dotnet-version: '10.0.x'
    - uses: actions/setup-python@v5
      timeout-minutes: 5
      with:
        python-version: '3.12'
    # See ci-build.yml for the rationale on this cache shape (no packages.lock.json
    # committed, so setup-dotnet's built-in cache: option cannot be used).
    # continue-on-error + timeout-minutes: a cache-backend failure must only cost the
    # speedup, never fail the job -- but continue-on-error alone cannot catch a HANG,
    # only a returned error (#926).
    - name: Cache NuGet packages
      uses: actions/cache@v4
      continue-on-error: true
      timeout-minutes: 5
      with:
        path: ~/.nuget/packages
        key: ${{ runner.os }}-nuget-${{ hashFiles('Directory.Packages.props', '**/*.csproj') }}
        restore-keys: |
          ${{ runner.os }}-nuget-

    - name: Run every selftest fixture
      id: run
      shell: bash
      timeout-minutes: 12
      run: |
        set -o pipefail
        mkdir -p mutant-results

        # issue #855 defects 4/5: same discovery mechanism as the mutants job --
        # `python3 test/mutants/gate_lib.py selftests`, which calls run_mutant.py's
        # own discover_entries() (kind validation included) instead of a second,
        # hand-copied inline python block. Exits non-zero on an empty glob, a file
        # missing 'id'/'expect_verdict', or an entry with an unrecognized kind --
        # distinct from "ran fine, found zero selftest-kind entries" below.
        if ! SELFTEST_ENTRIES="$(python3 test/mutants/gate_lib.py selftests)"; then
          echo "::error::Failed to discover selftest ids from test/mutants/entries/ -- see the error printed above (an empty directory, an entry file missing its id/expect_verdict, or an entry with an unrecognized kind -- issue #855 defect 4)."
          exit 1
        fi

        # Same guard as the mutants job: zero selftest entries discovered must be a
        # loud failure, never a silent green no-op.
        if [ -z "$SELFTEST_ENTRIES" ]; then
          echo "::error::No 'selftest' entries were discovered under test/mutants/entries/. Refusing to report a pass without evaluating anything."
          exit 1
        fi

        echo "Discovered selftest entries (id, expected verdict):"
        echo "$SELFTEST_ENTRIES" | sed 's/^/  - /'
        echo

        # issue #855 defect 4: this job's own count of ids it is about to execute,
        # consumed by the `gate` job's discovered-vs-executed reconciliation.
        SELFTEST_COUNT="$(echo "$SELFTEST_ENTRIES" | grep -c .)"
        echo "selftest_count=$SELFTEST_COUNT" >> "$GITHUB_OUTPUT"

        OVERALL_FAILED=0
        while IFS=$'\t' read -r SELFTEST_ID EXPECT_VERDICT; do
          if [ -z "$SELFTEST_ID" ] || [ -z "$EXPECT_VERDICT" ]; then
            echo "::error::Encountered an empty selftest id or expected verdict while iterating the manifest -- this must never be silently skipped."
            OVERALL_FAILED=1
            continue
          fi

          echo "=================================================="
          echo "Running selftest: $SELFTEST_ID (expect $EXPECT_VERDICT)"
          echo "=================================================="
          mkdir -p "mutant-results/$SELFTEST_ID"
          if python3 test/mutants/run_mutant.py \
              --mutant "$SELFTEST_ID" \
              --expect-verdict "$EXPECT_VERDICT" \
              --trx-dir "mutant-results/$SELFTEST_ID" \
              2>&1 | tee "mutant-results/$SELFTEST_ID/console.log"; then
            echo "selftest '$SELFTEST_ID': runner produced the expected verdict"
          else
            echo "::error::selftest '$SELFTEST_ID' did NOT produce the expected verdict ($EXPECT_VERDICT) -- see mutant-results/$SELFTEST_ID/console.log"
            OVERALL_FAILED=1
          fi
          echo
        done <<< "$SELFTEST_ENTRIES"

        if [ "$OVERALL_FAILED" -ne 0 ]; then
          echo "META_SELFTEST_RESULT: FAIL"
          exit 1
        fi
        echo "META_SELFTEST_RESULT: PASS"

    - name: Upload selftest artifacts
      uses: actions/upload-artifact@v4
      if: always()
      continue-on-error: true
      timeout-minutes: 5
      with:
        name: selftest
        path: mutant-results/

  # Single pass/fail summary (issue #834 rule #6: "CI ... reports a single pass/fail")
  # and the required status check for dotnet10 (issue #834 rule #7). This job carries
  # NO path filter, and its own `if: ${{ !cancelled() }}` condition (see below), so it
  # still runs when an upstream job failed or was skipped -- it is the one job in this
  # workflow that must post a status in every non-cancelled outcome, because Gitea's
  # required-check evaluation for a PR hangs forever on a context that never arrives.
  # `mutants`/`meta-selftest` being SKIPPED (the `changes` job selected nothing) is
  # treated as a pass here, not a failure -- only an actual `failure`/`cancelled` result
  # fails the gate. issue #968: this specifically means "0 selected, `changes` reported
  # has_selection=false" is a pass; "0 selected because `changes` itself FAILED" is a
  # `changes.result == 'failure'`, which is NOT skipped and therefore fails is_ok()
  # below -- these two are deliberately different job outcomes precisely so this
  # summary can tell them apart without any extra plumbing.
  #
  # Judge this job's own log, not the Gitea badge, for the same reason as every other
  # workflow in this repo (see CLAUDE.md "CI red does not mean failed") -- but see the
  # header comment above: for THIS workflow, a red `gate` step now means a real
  # regression, not the known upload-artifact quirk and not an accepted, documented
  # gap. Read the step output either way.
  #
  # INVARIANT (issue #973): this job has NO `actions/checkout` step and must stay that
  # way -- every step here is pure bash/arithmetic over `needs.*.outputs`, never a
  # repo-relative script. #968 briefly violated this (calling out to
  # `python3 test/mutants/gate_lib.py reconcile`), which the repo tree being absent
  # here turned into a job failure indistinguishable, at a glance, from a real
  # reconciliation mismatch -- see the "Summarize mutation gate result" step's own
  # comment for the full postmortem and why the fix stayed inline rather than adding a
  # checkout.
  gate:
    needs: [changes, mutants, meta-selftest]
    # !cancelled(), not always() (#885 cross-vendor review, PR #887): this workflow has a
    # concurrency block with cancel-in-progress on pull_request — a job condition is
    # re-evaluated when the run is cancelled (e.g. a superseded PR push), and always()
    # stays true through that, so an always()-gated job could still start after the run
    # it belongs to was supposed to be cancelled. !cancelled() preserves the "run even if
    # mutants/meta-selftest were skipped (changes.outputs.has_selection == 'false')"
    # behavior this condition exists for — skipped is not cancelled — while actually
    # stopping on cancellation.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5  # not enforced by this runner (job.timeout-minutes is ignored) -- real bound is the step-level timeout-minutes below; see docs/ci-operations.md
    steps:
    - name: Summarize mutation gate result
      timeout-minutes: 2
      env:
        CHANGES_RESULT: ${{ needs.changes.result }}
        HAS_SELECTION: ${{ needs.changes.outputs.has_selection }}
        SELECTED_SECURITY_COUNT: ${{ needs.changes.outputs.selected_security_count }}
        SELECTED_SELFTEST_COUNT: ${{ needs.changes.outputs.selected_selftest_count }}
        TOTAL_SECURITY_ENTRIES: ${{ needs.changes.outputs.total_security_entries }}
        MUTANTS_RESULT: ${{ needs.mutants.result }}
        SECURITY_COUNT: ${{ needs.mutants.outputs.security_count }}
        SELFTEST_RESULT: ${{ needs.meta-selftest.result }}
        SELFTEST_COUNT: ${{ needs.meta-selftest.outputs.selftest_count }}
      run: |
        echo "changes job result:       $CHANGES_RESULT (has_selection=$HAS_SELECTION, selected_security_count=$SELECTED_SECURITY_COUNT of $TOTAL_SECURITY_ENTRIES total, selected_selftest_count=$SELECTED_SELFTEST_COUNT)"
        echo "mutants job result:       $MUTANTS_RESULT (security_count executed=$SECURITY_COUNT)"
        echo "meta-selftest job result: $SELFTEST_RESULT (selftest_count executed=$SELFTEST_COUNT)"

        is_ok() {
          case "$1" in
            success|skipped) return 0 ;;
            *) return 1 ;;
          esac
        }

        if ! is_ok "$CHANGES_RESULT" || ! is_ok "$MUTANTS_RESULT" || ! is_ok "$SELFTEST_RESULT"; then
          echo "MUTATION_GATE_RESULT: FAIL"
          exit 1
        fi

        # issue #968 (successor to issue #855 defect 4's discovered-vs-executed check):
        # "entries executed < entries selected" is a gate failure condition (issue
        # #1001 narrowed this from the original "!=" to "<" only -- see that issue's
        # own comment further down, next to the actual comparison, for why the ">"
        # direction was loosened to a warning instead of staying fatal).
        # #855 defect 4's original version compared TOTAL DISCOVERED entries against
        # executed, which only worked because every discovered entry always ran; #968
        # makes running a SUBSET on a pull_request legitimate (per-entry relevance
        # selection), so the baseline moved from "discovered" to "selected".
        #
        # POSTMORTEM (#973, discovered on this PR's own first CI run): this comparison
        # originally shelled out to `python3 test/mutants/gate_lib.py reconcile`. The
        # `gate` job has NEVER had an `actions/checkout` step -- by design, it is the
        # one job in this workflow that must unconditionally post a status (see this
        # job's own header comment), and every other step in it is pure bash/arithmetic
        # over job outputs, needing nothing from the working tree. Calling out to a
        # repo file broke that invariant silently: `changes`/`mutants`/`meta-selftest`
        # all reported success (61 selected, 61 executed, fully reconciled), and `gate`
        # still failed, because `python3: can't open file
        # '.../test/mutants/gate_lib.py': No such file or directory` -- the script
        # simply was not on disk. A repo-wide sweep (issue #973 review) found this is
        # the ONLY job in ANY workflow file that references a repo-relative script
        # without ever checking out; nothing else needed the same fix.
        #
        # FIX: the comparison is inline bash again, exactly as it was before #968 (just
        # "selected" instead of "discovered") -- no checkout added, because adding one
        # here would work against the reason this job has no other tree dependency:
        # `gate_lib.py reconcile` would ALSO force a full load_entries() (parsing all
        # ~67 entry files) just to perform a two-integer comparison, coupling a trivial
        # check to registry-wide parseability that `changes` job's own
        # check-mutant-entries-parse.py guard already owns.
        #
        # TWO IMPLEMENTATIONS NOW EXIST, DELIBERATELY: test/mutants/gate_lib.py's
        # `reconcile()` function/CLI subcommand still exists and is still covered by
        # test/mutants/_selftest/selftest_select_relevant_entries.py's
        # check_reconcile() -- kept as a documented, independently-tested reference
        # spec of this rule and for manual `python3 test/mutants/gate_lib.py reconcile
        # --selected N --executed M` diagnostic use, but it is NOT what this job calls.
        # issue #1001 updated `reconcile()` to the SAME asymmetric selected/executed
        # rule as the inline version below (executed < selected fails, executed >
        # selected passes with a warning) specifically so this paragraph's claim stays
        # true; before #1001 both sides were a plain equality check. This is judged
        # safe specifically because the rule itself is a two-branch integer comparison
        # plus a formatted message -- unlike is_change_relevant() (real matching
        # logic: prefix/set/regex checks that genuinely could drift if duplicated),
        # there is no meaningful way for this comparison to diverge between the Python
        # version and the bash version below as long as both are kept in the same
        # shape on every edit. The inline version below has its own regression
        # coverage --
        # test/mutants/_selftest/selftest_gate_job_reconciliation.py extracts and runs
        # THIS job's actual step (not a copy) under match/shortfall/surplus/skip
        # scenarios (issue #1001 added the surplus case), including running it from a
        # directory with NO repo checked out at all -- the exact condition #973
        # exposed -- so this specific failure mode is now regression-tested, not just
        # fixed once.
        #
        # Only meaningful when HAS_SELECTION is the literal string 'true' (mutants/
        # meta-selftest actually ran with something selected) -- NOT merely "the count
        # fields happen to be set". When `changes` reported has_selection=false, it
        # already logged an explicit reason (this diff genuinely touches nothing
        # gated, confirmed by gate_lib.py's relevance self-check) and there is nothing
        # to reconcile: a bare 0-selected/0-executed match here would be
        # indistinguishable from the exact silent-pass failure mode #968 exists to
        # prevent, so this is deliberately narrower than "reconcile whenever the
        # numbers exist".
        #
        # issue #1001 (root cause of #998's failure -- see the `mutants` job's checkout
        # step for the fetch-depth fix and this file's "SAME event/SHA inputs" comment
        # above): a shallow `mutants`/`meta-selftest` checkout made `select`'s diff
        # computation fail and fail open to "select everything", so EXECUTED could
        # exceed SELECTED even though nothing was actually under-executed -- the
        # fetch-depth fix addresses the root cause, but the comparison below is ALSO
        # loosened, on purpose, in one direction only:
        #   EXECUTED < SELECTED  -- still a hard FAIL. This is the direction #968's
        #     check exists to catch: an entry `changes` believed should run did NOT
        #     run. Nothing about #1001 changes that risk or its severity.
        #   EXECUTED > SELECTED  -- now a WARNING, not a failure. More mutants ran
        #     than `changes` believed were required. That is never itself a security
        #     gap (every mutant that ran still had to report KILLED), and treating it
        #     as fatal makes the reconciliation MORE fragile in exactly the failure
        #     mode #1001 diagnoses: `select`'s fail-open rule (issue #855, preserved
        #     through #968) can legitimately fire independently in `changes` and in
        #     `mutants`/`meta-selftest` for reasons that have nothing to do with a
        #     real defect -- a transient git error, an event payload this workflow
        #     does not fully model, or (had the fetch-depth fix been incomplete) a
        #     residual checkout-depth mismatch -- and in every one of those cases the
        #     safe side to land on is "ran too much", not "ran too little". Failing
        #     the required check on the safe side would have re-created #998's exact
        #     symptom (a correct, defensible selection difference blocking merge) for
        #     a DIFFERENT root cause than the one #1001 fixes, the next time any such
        #     divergence occurs. The WARNING is printed with both totals precisely
        #     because a superset is usually still worth a human looking at, even
        #     though it must not block the gate.
        #   EXECUTED == SELECTED -- unchanged, silent OK.
        if [ "$HAS_SELECTION" = "true" ]; then
          SELECTED_TOTAL=$(( ${SELECTED_SECURITY_COUNT:-0} + ${SELECTED_SELFTEST_COUNT:-0} ))
          EXECUTED_TOTAL=$(( ${SECURITY_COUNT:-0} + ${SELFTEST_COUNT:-0} ))
          if [ "$EXECUTED_TOTAL" -lt "$SELECTED_TOTAL" ]; then
            echo "::error::entries executed ($EXECUTED_TOTAL = security $SECURITY_COUNT + selftest $SELFTEST_COUNT) < entries selected ($SELECTED_TOTAL = security $SELECTED_SECURITY_COUNT + selftest $SELECTED_SELFTEST_COUNT). issue #968/#1001: an entry was SELECTED to run but the mutants/meta-selftest job executed FEWER than that -- the dangerous direction (a mutant that should have run, did not) -- this must never be a silent pass."
            echo "MUTATION_GATE_RESULT: FAIL"
            exit 1
          elif [ "$EXECUTED_TOTAL" -gt "$SELECTED_TOTAL" ]; then
            echo "::warning::entries executed ($EXECUTED_TOTAL = security $SECURITY_COUNT + selftest $SELFTEST_COUNT) > entries selected ($SELECTED_TOTAL = security $SELECTED_SECURITY_COUNT + selftest $SELECTED_SELFTEST_COUNT). issue #1001: the safe direction (more mutants ran than believed required, e.g. the two independent selections diverged or one fell back to fail-open) -- tolerated, not a gate failure, but worth checking why they diverged."
            echo "entries executed ($EXECUTED_TOTAL) > entries selected ($SELECTED_TOTAL) -- WARNING, not a failure (issue #1001)"
          else
            echo "entries selected ($SELECTED_TOTAL) == entries executed ($EXECUTED_TOTAL) -- OK"
          fi
        elif [ "$CHANGES_RESULT" = "success" ]; then
          echo "0 entries selected this run (changes job confirmed this diff genuinely touches no gated path; its relevance self-check passed) -- nothing to reconcile. This is a genuine PASS, not a masked no-op (issue #968)."
        fi

        echo "MUTATION_GATE_RESULT: PASS"
