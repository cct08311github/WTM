name: e2e-smoke

# Browser based end-to-end tests (Playwright, Chromium): the LayUI front end against test/WalkingTec.Mvvm.LayUI.E2EHost (#270, #271)
# and the Vue3Demo SPA with its API (#272). Not a required check. Reports: route coverage baseline of both sites
# (artifact e2e-route-coverage) and JS function coverage of framework_layui.js (artifact e2e-js-coverage, #271), both also in the
# step summary; on failure also Playwright traces, screenshots and the server logs (artifact e2e-failure-artifacts).
# Permission matrix (#273): every action of the route inventory called by anonymous / no-role / limited-role / administrator identities with plain
# HTTP and compared with the checked-in expectations (test/WalkingTec.Mvvm.E2E/Security); report in the step summary and the artifact
# e2e-permission-matrix.
# Tests tagged [TestCategory("nightly")] are left out here (none yet); run them with --filter "TestCategory=nightly".

on:
  pull_request:
    branches: [dotnet10]
  push:
    branches: [dotnet10]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-smoke-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  e2e-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: demo/WalkingTec.Mvvm.Vue3Demo/ClientApp/package-lock.json

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', 'common.props', 'version.props', 'NuGet.Config') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore
        run: dotnet restore test/WalkingTec.Mvvm.E2E/WalkingTec.Mvvm.E2E.csproj

      # The Vue3Demo SPA the tests run against. VITE_API_URL is empty so that the SPA calls the site it was loaded from
      # (the regular build has the development address http://localhost:8598 compiled in); the output goes to dist-e2e, the
      # directory the test site serves it from.
      - name: Build the Vue3Demo SPA
        working-directory: demo/WalkingTec.Mvvm.Vue3Demo/ClientApp
        env:
          VITE_API_URL: ""
        run: |
          npm ci
          npm run build -- --outDir dist-e2e

      # builds both sites under test (project references without their assemblies), the instrumentation library and the tests
      - name: Build
        run: dotnet build test/WalkingTec.Mvvm.E2E/WalkingTec.Mvvm.E2E.csproj -c Release --no-restore

      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('test/WalkingTec.Mvvm.E2E/WalkingTec.Mvvm.E2E.csproj') }}

      - name: Install Playwright Chromium
        run: pwsh test/WalkingTec.Mvvm.E2E/bin/Release/net10.0/playwright.ps1 install --with-deps chromium

      - name: Run E2E tests
        run: >
          dotnet test test/WalkingTec.Mvvm.E2E/WalkingTec.Mvvm.E2E.csproj
          -c Release --no-build
          --filter "TestCategory!=nightly"
          --logger "trx;LogFileName=e2e-tests.trx"
          --results-directory TestResults/trx

      - name: Coverage summary
        if: always()
        run: |
          shopt -s nullglob
          for f in TestResults/e2e/route-coverage/*.report.md TestResults/e2e/js-coverage/*.report.md TestResults/e2e/permission-matrix/summary.md; do
            cat "$f" >> "$GITHUB_STEP_SUMMARY"
          done

      - name: Upload route coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-route-coverage
          path: TestResults/e2e/route-coverage/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload JS coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-js-coverage
          path: TestResults/e2e/js-coverage/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload permission matrix report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-permission-matrix
          path: TestResults/e2e/permission-matrix/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-failure-artifacts
          path: |
            TestResults/e2e/failures/
            TestResults/e2e/server/
            TestResults/trx/
          if-no-files-found: warn
          retention-days: 14
