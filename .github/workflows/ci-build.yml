name: WTM Build and Test
on:
  push:
    branches: [ dotnet8, "feature/**" ]
  pull_request:
    branches: [ dotnet8 ]
jobs:
  release-tooling-test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Validate release script syntax
      run: bash -n scripts/release-github-package.sh
    - name: Run release script smoke tests
      run: bash test/release-script-tests.sh
  build-and-test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'
    - run: dotnet restore WalkingTec.Mvvm.sln
    - run: dotnet build WalkingTec.Mvvm.sln --no-restore -c Release

    - name: Test with coverage
      run: |
        dotnet test WalkingTec.Mvvm.sln \
          --no-build -c Release \
          --verbosity normal \
          --logger "trx;LogFileName=test-results.trx" \
          --collect:"XPlat Code Coverage" \
          --settings coverlet.runsettings \
          --results-directory ./TestResults

    - name: Install ReportGenerator
      run: dotnet tool install -g dotnet-reportgenerator-globaltool

    - name: Generate coverage report
      run: |
        reportgenerator \
          -reports:"TestResults/**/coverage.cobertura.xml" \
          -targetdir:"TestResults/CoverageReport" \
          -reporttypes:"Html;lcov;Cobertura;Badges" \
          -title:"WTM Coverage Report"

    - name: Enforce Coverage Gate
      run: |
        LINE_COV=$(grep -oP 'line-rate="\K[^"]+' TestResults/CoverageReport/Cobertura.xml | head -1)
        BRANCH_COV=$(grep -oP 'branch-rate="\K[^"]+' TestResults/CoverageReport/Cobertura.xml | head -1)
        echo "Line Coverage: $LINE_COV"
        echo "Branch Coverage: $BRANCH_COV"
        LINE_PCT=$(awk -v cov="$LINE_COV" 'BEGIN {print cov * 100}')
        BRANCH_PCT=$(awk -v cov="$BRANCH_COV" 'BEGIN {print cov * 100}')
        echo "Line %: $LINE_PCT"
        echo "Branch %: $BRANCH_PCT"
        if (( $(echo "$LINE_PCT < 60.0" | bc -l) )); then
          echo "::error::Line coverage ($LINE_PCT%) is below threshold (60%)"
          exit 1
        fi
        if (( $(echo "$BRANCH_PCT < 40.0" | bc -l) )); then
          echo "::error::Branch coverage ($BRANCH_PCT%) is below threshold (40%)"
          exit 1
        fi

    - name: Upload test results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: test-results
        path: "TestResults/**/*.trx"

    - name: Upload coverage report
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: coverage-report
        path: TestResults/CoverageReport/
  js-test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: '20'
    - name: Install JS test dependencies
      run: npm ci
      working-directory: test/WalkingTec.Mvvm.Js.Tests
    - name: Run JS tests
      run: npm test
      working-directory: test/WalkingTec.Mvvm.Js.Tests
  security-scan:
    runs-on: ubuntu-latest
    needs: [release-tooling-test, build-and-test]
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'
    - run: dotnet list WalkingTec.Mvvm.sln package --vulnerable --include-transitive
