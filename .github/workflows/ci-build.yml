name: WTM Build and Test
on:
  workflow_dispatch:
  # No feature/**, feat/** here on purpose: every feature branch reaches dotnet10 via a
  # PR, whose pull_request trigger below already runs the full suite. Firing both meant
  # two concurrent full suites per push, starving the self-hosted runner (#640).
  push:
    branches: [ dotnet8, dotnet10 ]
    # Docs-only changes never touch build/test outcome. A PR containing ONLY docs-path
    # changes will therefore have no ci-build statuses at all — accepted policy (#670).
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - '.claude/**'
      - '.gitea/**'
  pull_request:
    branches: [ dotnet8, dotnet10 ]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - '.claude/**'
      - '.gitea/**'

permissions:
  contents: read

# One self-hosted runner (#640): a superseded PR push should cancel its own in-flight
# run instead of queuing behind it. Pushes to dotnet10/dotnet8 must NOT cancel each
# other (each push is a distinct, wanted result), so cancel-in-progress is scoped to
# pull_request events only (#670).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  release-tooling-test:
    if: github.repository != 'cct08311github/WTM'  # internal-tooling only, skipped on public GitHub mirror where scripts are excluded by .sync/ manifest
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
    - name: Validate release script syntax
      run: bash -n scripts/release-gitea-package.sh
    - name: Run release script smoke tests
      run: bash test/release-script-tests.sh
  build-and-test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
    - uses: actions/setup-dotnet@v5
      with:
        dotnet-version: '10.0.x'
    # setup-dotnet's built-in `cache:` option requires a packages.lock.json, which this
    # repo does not commit — fall back to actions/cache keyed on the CPM version file and
    # every csproj. continue-on-error so a cache-backend hiccup on the self-hosted Gitea
    # runner (same class of issue as actions/upload-artifact@v4, #11) can only skip the
    # speedup, never fail the job (#670).
    - name: Cache NuGet packages
      uses: actions/cache@v4
      continue-on-error: true
      with:
        path: ~/.nuget/packages
        key: ${{ runner.os }}-nuget-${{ hashFiles('Directory.Packages.props', '**/*.csproj') }}
        restore-keys: |
          ${{ runner.os }}-nuget-
    - run: dotnet restore core.slnf
    - run: dotnet build core.slnf --no-restore -c Release

    - name: Test with coverage
      run: |
        dotnet test core.slnf \
          --no-build -c Release \
          --verbosity normal \
          --filter "TestCategory!=Integration" \
          --logger "trx;LogFileName=test-results.trx" \
          --collect:"XPlat Code Coverage" \
          --settings coverlet.runsettings \
          --results-directory ./TestResults

    - name: Install ReportGenerator
      run: |
        dotnet tool install -g dotnet-reportgenerator-globaltool
        echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"

    - name: Generate coverage report
      run: |
        reportgenerator \
          -reports:"TestResults/**/coverage.cobertura.xml" \
          -targetdir:"TestResults/CoverageReport" \
          -reporttypes:"Html;lcov;Cobertura;Badges" \
          -title:"WTM Coverage Report"

    - name: Enforce Coverage Gate
      run: |
        # Current baseline: ~20% line, ~16% branch (large legacy framework).
        # Target: Line 60%, Branch 40%.
        # coverage ratchet: raise gate by ~2pt whenever actual rises; 60/40 target tracked in #671
        LINE_THRESHOLD=18.0
        BRANCH_THRESHOLD=14.0
        LINE_COV=$(grep -oP -m 1 'line-rate="\K[^"]+' TestResults/CoverageReport/Cobertura.xml)
        BRANCH_COV=$(grep -oP -m 1 'branch-rate="\K[^"]+' TestResults/CoverageReport/Cobertura.xml)
        LINE_PCT=$(awk -v cov="$LINE_COV" 'BEGIN {print cov * 100}')
        BRANCH_PCT=$(awk -v cov="$BRANCH_COV" 'BEGIN {print cov * 100}')
        echo "Line Coverage: ${LINE_PCT}% (threshold: ${LINE_THRESHOLD}%)"
        echo "Branch Coverage: ${BRANCH_PCT}% (threshold: ${BRANCH_THRESHOLD}%)"
        if (( $(echo "$LINE_PCT < $LINE_THRESHOLD" | bc -l) )); then
          echo "::error::Line coverage (${LINE_PCT}%) is below threshold (${LINE_THRESHOLD}%)"
          exit 1
        fi
        if (( $(echo "$BRANCH_PCT < $BRANCH_THRESHOLD" | bc -l) )); then
          echo "::error::Branch coverage (${BRANCH_PCT}%) is below threshold (${BRANCH_THRESHOLD}%)"
          exit 1
        fi

    - name: Upload test results
      uses: actions/upload-artifact@v4
      if: always()
      continue-on-error: true
      with:
        name: test-results
        path: "TestResults/**/*.trx"

    - name: Upload coverage report
      uses: actions/upload-artifact@v4
      if: always()
      continue-on-error: true
      with:
        name: coverage-report
        path: TestResults/CoverageReport/
  js-test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
    - uses: actions/setup-node@v5
      with:
        node-version: '20'
    # continue-on-error per #670: a cache-backend failure must only cost the speedup,
    # never fail the job (see NuGet cache comment above in build-and-test).
    - name: Cache npm packages
      uses: actions/cache@v4
      continue-on-error: true
      with:
        path: ~/.npm
        key: ${{ runner.os }}-npm-${{ hashFiles('test/WalkingTec.Mvvm.Js.Tests/package-lock.json') }}
        restore-keys: |
          ${{ runner.os }}-npm-
    - name: Install JS test dependencies
      run: npm ci
      working-directory: test/WalkingTec.Mvvm.Js.Tests
    - name: Run JS tests
      run: npm test
      working-directory: test/WalkingTec.Mvvm.Js.Tests
  security-scan:
    runs-on: ubuntu-latest
    needs: [release-tooling-test, build-and-test]
    # release-tooling-test is if-gated off on the public GitHub mirror (see its own `if:`
    # above), which leaves it `skipped` there; a plain `needs:` treats a skipped dependency
    # as failed and skips this job too. Require only build-and-test to have succeeded, but
    # keep both entries in `needs` so this job still waits for release-tooling-test to finish
    # (ordering) wherever it does run (#658).
    if: always() && needs.build-and-test.result == 'success'
    steps:
    - uses: actions/checkout@v5
    - uses: actions/setup-dotnet@v5
      with:
        dotnet-version: '10.0.x'
    - name: Cache NuGet packages
      uses: actions/cache@v4
      continue-on-error: true
      with:
        path: ~/.nuget/packages
        key: ${{ runner.os }}-nuget-${{ hashFiles('Directory.Packages.props', '**/*.csproj') }}
        restore-keys: |
          ${{ runner.os }}-nuget-
    - run: dotnet restore WalkingTec.Mvvm.sln
    - run: dotnet list WalkingTec.Mvvm.sln package --vulnerable --include-transitive
