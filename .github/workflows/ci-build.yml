name: WTM Build and Test
on:
  workflow_dispatch:
  # No feature/**, feat/** here on purpose: every feature branch reaches dotnet10 via a
  # PR, whose pull_request trigger below already runs the full suite. Firing both meant
  # two concurrent full suites per push, starving the self-hosted runner (#640).
  push:
    branches: [ dotnet8, dotnet10 ]
    # Docs-only changes never touch build/test outcome. A PR containing ONLY docs-path
    # changes will therefore have no ci-build statuses at all — accepted policy (#670).
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - '.claude/**'
      - '.gitea/**'
  pull_request:
    branches: [ dotnet8, dotnet10 ]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - '.claude/**'
      - '.gitea/**'

permissions:
  contents: read

# One self-hosted runner (#640): a superseded PR push should cancel its own in-flight
# run instead of queuing behind it. Pushes to dotnet10/dotnet8 must NOT cancel each
# other (each push is a distinct, wanted result), so cancel-in-progress is scoped to
# pull_request events only (#670).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  release-tooling-test:
    if: github.repository != 'cct08311github/WTM'  # internal-tooling only, skipped on public GitHub mirror where scripts are excluded by .sync/ manifest
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
    - name: Validate release script syntax
      run: |
        bash -n scripts/release-gitea-package.sh
        bash -n scripts/publish-to-gitea.sh
        bash -n scripts/reconcile-release-version.sh
        python3 -m py_compile scripts/resolve-gitea-token.py scripts/check-gitea-token-not-sourced.py
        # #925 cross-vendor review findings 1 & 3: the JSON-based vulnerability-scan
        # parser and the version-cohort checker that replaced/hardened
        # publish-nuget.yml's pre-publish gate.
        python3 -m py_compile scripts/check-vulnerable-packages.py scripts/check-package-cohort.py
    - name: Run release script smoke tests
      run: bash test/release-script-tests.sh
    - name: Run publish-to-gitea smoke tests
      run: bash test/publish-to-gitea-tests.sh
    # #925: unit-tests scripts/reconcile-release-version.sh -- the tag / version.props /
    # CHANGELOG reconciliation publish-nuget.yml's "Determine and reconcile package
    # version" step runs on every publish -- against fabricated fixtures, since a real
    # publish can't be exercised here.
    - name: Run release version reconciliation tests
      run: bash test/reconcile-release-version-tests.sh
    # #925 cross-vendor review finding 1: proves scripts/check-vulnerable-packages.py
    # against fabricated `dotnet list package --vulnerable --format json` fixtures,
    # including a ~3MB adversarial one reproducing the exact input size class that
    # SIGPIPE-false-greened the pipeline this script replaced.
    - name: Run vulnerable-package check tests
      run: bash test/check-vulnerable-packages-tests.sh
    # #925 cross-vendor review finding 3: proves scripts/check-package-cohort.py against
    # a throwaway local NuGet V3 fixture server (real HTTP calls, no external network
    # dependency) -- the partial-cohort scenario ("package N of 6 failed last time")
    # the finding describes.
    - name: Run package-cohort check tests
      run: bash test/check-package-cohort-tests.sh
  build-and-test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
    - uses: actions/setup-dotnet@v5
      with:
        dotnet-version: '10.0.x'
    # setup-dotnet's built-in `cache:` option requires a packages.lock.json, which this
    # repo does not commit — fall back to actions/cache keyed on the CPM version file and
    # every csproj. continue-on-error so a cache-backend hiccup on the self-hosted Gitea
    # runner (same class of issue as actions/upload-artifact@v4, #11) can only skip the
    # speedup, never fail the job (#670).
    - name: Cache NuGet packages
      uses: actions/cache@v4
      continue-on-error: true
      with:
        path: ~/.nuget/packages
        key: ${{ runner.os }}-nuget-${{ hashFiles('Directory.Packages.props', '**/*.csproj') }}
        restore-keys: |
          ${{ runner.os }}-nuget-
    - run: dotnet restore core.slnf
    - run: dotnet build core.slnf --no-restore -c Release

    - name: Test with coverage
      run: |
        # #902: core.slnf spans 7 test projects. MSBuild's default -maxcpucount (4) was
        # starting 4 testhosts + 4 coverlet collectors in the same second on this runner's
        # 4 CPU / 3.8GiB Docker VM. That co-scheduling both OOM-killed testhosts mid-run
        # ("Test Run Aborted" / "Total tests: Unknown" -- Api.Test, Core.Test and Etl.Test
        # were all victims across different runs, not one assembly's problem) AND broke
        # wall-clock/concurrency assumptions in unrelated tests via resource contention
        # (#890's 10s budgets, #878's race preconditions). -m:1 makes MSBuild run one test
        # project at a time: peak memory drops ~4x, and each serialized testhost gets the
        # full 4 CPUs to itself, so individual runs get *faster* -- which makes #890/#878
        # safer, not riskier. The tradeoff is a longer test step wall-clock; that's expected
        # and was accepted after measurement, not assumed. Do not drop this for "speed up
        # CI" without re-reading #902. (DOTNET_gcServer/UseSharedCompilation are a
        # deliberate non-change here -- this step is --no-build and every project here
        # targets Microsoft.NET.Sdk, which already defaults to workstation GC, so those
        # knobs are a no-op for this job; see #902's comment. That reasoning does NOT
        # transfer to e2e-test.yml, whose demo app is Microsoft.NET.Sdk.Web and genuinely
        # defaults to server GC.)
        #
        # #902: all 7 projects previously logged to the same fixed name
        # ("trx;LogFileName=test-results.trx"), so only the last assembly's TRX ever
        # survived in ./TestResults -- every earlier one hit "WARNING: Overwriting results
        # file". Dropping the fixed LogFileName lets VSTest auto-name each project's TRX so
        # every assembly's results are kept; the "Upload test results" step's glob
        # (TestResults/**/*.trx, below) already matches auto-named files.
        dotnet test core.slnf \
          -m:1 \
          --no-build -c Release \
          --verbosity normal \
          --filter "TestCategory!=Integration" \
          --logger "trx" \
          --collect:"XPlat Code Coverage" \
          --settings coverlet.runsettings \
          --results-directory ./TestResults

    - name: Install ReportGenerator
      run: |
        dotnet tool install -g dotnet-reportgenerator-globaltool
        echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"

    - name: Generate coverage report
      run: |
        reportgenerator \
          -reports:"TestResults/**/coverage.cobertura.xml" \
          -targetdir:"TestResults/CoverageReport" \
          -reporttypes:"Html;lcov;Cobertura;Badges" \
          -title:"WTM Coverage Report"

    - name: Enforce Coverage Gate
      run: |
        # Current baseline: ~20% line, ~16% branch (large legacy framework).
        # Target: Line 60%, Branch 40%.
        # coverage ratchet: raise gate by ~2pt whenever actual rises; 60/40 target tracked in #671
        LINE_THRESHOLD=18.0
        BRANCH_THRESHOLD=14.0
        LINE_COV=$(grep -oP -m 1 'line-rate="\K[^"]+' TestResults/CoverageReport/Cobertura.xml)
        BRANCH_COV=$(grep -oP -m 1 'branch-rate="\K[^"]+' TestResults/CoverageReport/Cobertura.xml)
        LINE_PCT=$(awk -v cov="$LINE_COV" 'BEGIN {print cov * 100}')
        BRANCH_PCT=$(awk -v cov="$BRANCH_COV" 'BEGIN {print cov * 100}')
        echo "Line Coverage: ${LINE_PCT}% (threshold: ${LINE_THRESHOLD}%)"
        echo "Branch Coverage: ${BRANCH_PCT}% (threshold: ${BRANCH_THRESHOLD}%)"
        if (( $(echo "$LINE_PCT < $LINE_THRESHOLD" | bc -l) )); then
          echo "::error::Line coverage (${LINE_PCT}%) is below threshold (${LINE_THRESHOLD}%)"
          exit 1
        fi
        if (( $(echo "$BRANCH_PCT < $BRANCH_THRESHOLD" | bc -l) )); then
          echo "::error::Branch coverage (${BRANCH_PCT}%) is below threshold (${BRANCH_THRESHOLD}%)"
          exit 1
        fi

    - name: Upload test results
      uses: actions/upload-artifact@v4
      if: always()
      continue-on-error: true
      with:
        name: test-results
        path: "TestResults/**/*.trx"

    - name: Upload coverage report
      uses: actions/upload-artifact@v4
      if: always()
      continue-on-error: true
      with:
        name: coverage-report
        path: TestResults/CoverageReport/
  js-test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
    - uses: actions/setup-node@v5
      with:
        node-version: '20'
    # continue-on-error per #670: a cache-backend failure must only cost the speedup,
    # never fail the job (see NuGet cache comment above in build-and-test).
    - name: Cache npm packages
      uses: actions/cache@v4
      continue-on-error: true
      with:
        path: ~/.npm
        key: ${{ runner.os }}-npm-${{ hashFiles('test/WalkingTec.Mvvm.Js.Tests/package-lock.json') }}
        restore-keys: |
          ${{ runner.os }}-npm-
    - name: Install JS test dependencies
      run: npm ci
      working-directory: test/WalkingTec.Mvvm.Js.Tests
    - name: Run JS tests
      run: npm test
      working-directory: test/WalkingTec.Mvvm.Js.Tests
  security-scan:
    runs-on: ubuntu-latest
    needs: [release-tooling-test, build-and-test]
    # release-tooling-test is if-gated off on the public GitHub mirror (see its own `if:`
    # above), which leaves it `skipped` there; a plain `needs:` treats a skipped dependency
    # as failed and skips this job too. Require only build-and-test to have succeeded, but
    # keep both entries in `needs` so this job still waits for release-tooling-test to finish
    # (ordering) wherever it does run (#658).
    # !cancelled(), not always() (#885 cross-vendor review, PR #887): this workflow has a
    # concurrency block with cancel-in-progress on pull_request — a job condition is
    # re-evaluated when the run is cancelled (e.g. a superseded PR push), and always()
    # stays true through that, so an always()-gated job could still start after the run
    # it belongs to was supposed to be cancelled. !cancelled() preserves the "run even if
    # release-tooling-test was skipped" behavior this condition exists for, while actually
    # stopping on cancellation.
    if: ${{ !cancelled() && needs.build-and-test.result == 'success' }}
    steps:
    - uses: actions/checkout@v5
    - uses: actions/setup-dotnet@v5
      with:
        dotnet-version: '10.0.x'
    - name: Cache NuGet packages
      uses: actions/cache@v4
      continue-on-error: true
      with:
        path: ~/.nuget/packages
        key: ${{ runner.os }}-nuget-${{ hashFiles('Directory.Packages.props', '**/*.csproj') }}
        restore-keys: |
          ${{ runner.os }}-nuget-
    - run: dotnet restore WalkingTec.Mvvm.sln
    - run: dotnet list WalkingTec.Mvvm.sln package --vulnerable --include-transitive
