name: Integration Tests (MSSQL)

permissions:
  contents: read

# Same self-hosted-runner rationale as ci-build.yml. This workflow currently has no
# pull_request trigger, so cancel-in-progress evaluates to false today; the group is
# added for consistency and to future-proof if a pull_request trigger is added (#670).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

on:
  workflow_dispatch:
  push:
    branches: [dotnet10]
    paths:
      - 'src/**'
      - 'test/WalkingTec.Mvvm.Integration.Test/**'

jobs:
  integration-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30  # not enforced by this runner (job.timeout-minutes is ignored) -- real bound is the step-level timeout-minutes below; see docs/ci-operations.md
    # NOT bounded by any step-level timeout-minutes below (issue #926): the runner
    # pulls this image and starts/health-checks the container as part of job setup,
    # BEFORE the first step (`checkout`, below) ever begins executing. A step's
    # timeout-minutes only wraps that step's own execution window, so it cannot reach
    # backwards to cover something that already finished (or hung) before the step
    # started. Considered replacing `services:` with a manually `docker run` step so
    # a timeout could wrap it, and rejected it here: that would throw away the
    # built-in --health-cmd/--health-interval/--health-retries gating below and the
    # runner's own service-container networking (the `mssql` hostname alias steps
    # rely on), for a startup phase that's already measured at ~6s on this host (see
    # the #767 comment) -- a rearchitect to protect an already-fast, already-healthy-
    # gated phase is a worse trade than documenting the gap plainly. If this phase
    # actually hangs, the existing "Wait for MSSQL ready" step's 12-minute
    # timeout-minutes (below) still bounds how long the JOB waits once its own step
    # starts polling -- it just does not, and cannot, bound the pull/start phase
    # itself. See docs/ci-operations.md's timeout-coverage section for the full
    # accounting of what step-level timeout-minutes does and does not cover repo-wide.
    services:
      # Issue #767: mcr.microsoft.com/mssql/server has no linux/arm64 build, so on the
      # self-hosted ARM64 (Apple Silicon) mac-mini runner it ran under QEMU x64 emulation.
      # That emulation doesn't just make startup slow — on this host it crashes the
      # engine outright on every launch (jemalloc/QEMU VA-space mapping failure: "Invalid
      # mapping of address ... in reserved address space below 0x400000000000"), so the
      # container exits before ever opening port 1433. That's why every prior run
      # (5383/5390/5397/5407/5432/5435) failed at "Wait for MSSQL ready": the 30-attempt/
      # 60s loop wasn't racing a slow boot, it was polling a dead container for its
      # entire budget, every single time. azure-sql-edge ships a native linux/arm64
      # image (same TDS-compatible SQL Server engine) and was verified to boot cleanly
      # and accept connections in ~6s on this exact runner host. The integration test
      # suite (test/WalkingTec.Mvvm.Integration.Test) only does plain EF Core CRUD via
      # DBTypeEnum.SqlServer — no full-text search, CLR, temporal tables, or other
      # features azure-sql-edge lacks — so the swap is compatible.
      # Issue #1020: this service had no memory bound at all -- the mac-mini runner's
      # Docker VM is a hard 4 CPU / 3.813GiB total (`docker info`, confirmed live
      # against this exact repo's Gitea Actions daemon while investigating this
      # issue), shared with the job container that's simultaneously restoring,
      # building, and running `dotnet test` in the very same job. Run 6509 died in
      # EnsureCreated() with "Error 945: insufficient system memory in resource pool
      # 'internal'" after the one failing test ran 13x slower than its usual 957ms --
      # thrashing before giving up, not a hard crash. The failure is intermittent
      # (majority of runs pass), so a green run after this change proves nothing by
      # itself; see the "Report MSSQL effective memory" step below for the actual
      # verification.
      #
      # MSSQL_MEMORY_LIMIT_MB is Microsoft's documented Linux/container memory knob
      # and is set below on that basis, but it was NOT possible to confirm it does
      # anything on this host: local testing directly against this repo's own Gitea
      # Actions Docker daemon (same image, same arch, same 4 CPU / 3.813GiB VM) at
      # 1536, 768, and 400 MB produced `sys.dm_os_sys_info.committed_target_kb`
      # values of 1480256, 1546520, and 1561152 respectively -- moving the WRONG way
      # as the requested limit dropped, i.e. tracking ambient host memory at
      # container start, not the env var. `container_type_desc` read `NONE` in every
      # trial, meaning the engine never believed it was running in a container on
      # this host at all, which is the likely reason its cgroup-aware memory sizing
      # path never engages. `--memory` below is the part that's actually verified
      # enforced: `/sys/fs/cgroup/memory.max` inside the container exactly matched
      # whatever `--memory` was set to in every trial, regardless of what the SQL
      # engine itself believed. `--memory=2560m` is set above the highest
      # self-determined `committed_target_kb` observed across those trials
      # (~2.03GiB, all measured at idle/startup, not under real test-suite load) so
      # this bound doesn't trade today's occasional graceful "Error 945" for a
      # deterministic cgroup OOM-kill of the whole container under normal load --
      # while still being well below the 3.813GiB VM total, leaving roughly 1.25GiB
      # for the job container plus this host's persistent Gitea infra containers
      # (gitea/gitea-db/act_runner, observed ~576MiB combined at idle).
      #
      # That 2.03GiB headroom target came from IDLE `committed_target_kb`, not from
      # running the actual test suite -- run 6509's failure happened on the 9th
      # create/drop cycle, i.e. under sustained load, which is exactly when a
      # cap sized from idle numbers could turn out to be too low. This was checked
      # afterwards, not assumed: the real 9-test suite was run twice back-to-back
      # locally against a container with these exact settings (same image, same
      # MSSQL_MEMORY_LIMIT_MB/--memory), with `docker stats` sampled throughout.
      # Peak container memory was ~663MiB (~26% of the 2560m cap) across both runs;
      # `sys.dm_os_sys_info.committed_kb` after the runs was ~152MiB -- both well
      # BELOW the idle-derived 2.03GiB figure, not above it. That local check has
      # its own limit, stated plainly: it ran mssql in isolation, without a sibling
      # container simultaneously doing `dotnet restore`/build/test the way the real
      # job does -- cgroup `--memory` caps are enforced per-container regardless of
      # what siblings do, so this isolates "does mssql's own query load exceed the
      # cap" (it doesn't, by a wide margin), but it does not reproduce whole-VM
      # contention from the sibling job container, which is the mechanism actually
      # suspected in run 6509. If a live run shows this cap is still too tight (or
      # too loose), see docs/ci-operations.md's "#1020" entry for the next step --
      # do not just raise the number blindly.
      mssql:
        image: mcr.microsoft.com/azure-sql-edge:latest
        env:
          ACCEPT_EULA: Y
          MSSQL_SA_PASSWORD: YourStr0ng!Pass
          MSSQL_MEMORY_LIMIT_MB: 1536
        ports:
          - 1433:1433
        options: >-
          --health-cmd "bash -c '(echo > /dev/tcp/127.0.0.1/1433) 2>/dev/null'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 60
          --health-start-period 5s
          --memory=2560m
    steps:
      - uses: actions/checkout@v5
        timeout-minutes: 5

      - uses: actions/setup-dotnet@v5
        timeout-minutes: 10
        with:
          dotnet-version: '10.0.x'

      - name: Wait for MSSQL ready
        timeout-minutes: 12
        run: |
          echo "Waiting for MSSQL to accept connections..."
          # Issue #767: azure-sql-edge boots in ~6s on this runner in normal
          # conditions, but the loop stays generous (up to 10 min) to absorb a
          # cold image pull plus a busy self-hosted runner without flaking.
          ATTEMPTS=200
          SLEEP=3
          for i in $(seq 1 $ATTEMPTS); do
            if (echo > /dev/tcp/mssql/1433) 2>/dev/null; then
              echo "MSSQL is ready (attempt $i/$ATTEMPTS, ~$((i * SLEEP))s elapsed)"
              exit 0
            fi
            echo "  attempt $i/$ATTEMPTS..."
            sleep $SLEEP
          done
          echo "MSSQL did not become ready after ~$((ATTEMPTS * SLEEP))s" >&2
          echo "--- Diagnostics (best-effort: this runner has privileged: false and no docker socket, so docker commands may be unavailable here) ---" >&2
          getent hosts mssql || echo "DNS resolution for 'mssql' failed"
          curl -v --max-time 5 "telnet://mssql:1433" || true
          docker ps -a || echo "docker CLI/socket not available in this job container"
          docker logs mssql || true
          exit 1

      - name: Report MSSQL effective memory (issue #1020)
        timeout-minutes: 5
        run: |
          # This step does not fix the flake described in #1020 -- it makes the
          # effective memory picture observable so a human reading this log (not a
          # green/red badge) can judge whether services.mssql.env.MSSQL_MEMORY_LIMIT_MB
          # and services.mssql.options' --memory (both set above) are doing anything.
          # A passing run proves nothing here since the failure is intermittent.
          #
          # sp_configure 'max server memory (MB)' does not exist on azure-sql-edge --
          # confirmed locally against this exact image: it raises Msg 15123 ("the
          # configuration option ... does not exist, or it may be an advanced
          # option."), so it cannot be used. sys.dm_os_sys_info is the DMV that is
          # actually supported and returns real data on this engine. docker exec +
          # sqlcmd is not an option either: this image ships no sqlcmd on arm64 (see
          # docker-compose.yml), and this job has no docker socket (see the previous
          # step's diagnostics comment) -- confirmed both independently while
          # investigating this issue.
          #
          # Uses a .NET 10 file-based app (`dotnet run --file`) with the same
          # Microsoft.Data.SqlClient version already pinned in
          # Directory.Packages.props, since dotnet is a client already proven to
          # reach `mssql:1433` from this exact job (the next step does it too via EF
          # Core, using the same package).
          cat > "$RUNNER_TEMP/mssql-mem-check.cs" <<'EOF'
          #:package Microsoft.Data.SqlClient@6.1.1

          using Microsoft.Data.SqlClient;

          // CI-only ephemeral container password -- not connected to any persistent resource
          var connStr = "Server=mssql,1433;Database=master;User Id=sa;Password=YourStr0ng!Pass;TrustServerCertificate=True;Connection Timeout=15";
          using var conn = new SqlConnection(connStr);
          conn.Open();
          using var cmd = conn.CreateCommand();
          cmd.CommandText = "SELECT physical_memory_kb, committed_target_kb, committed_kb, container_type_desc FROM sys.dm_os_sys_info;";
          using var reader = cmd.ExecuteReader();
          while (reader.Read())
          {
              Console.WriteLine($"[mssql memory] physical_memory_kb={reader["physical_memory_kb"]} committed_target_kb={reader["committed_target_kb"]} committed_kb={reader["committed_kb"]} container_type_desc={reader["container_type_desc"]}");
          }
          EOF
          echo "Configured in this file: MSSQL_MEMORY_LIMIT_MB=1536, services.mssql.options --memory=2560m"
          echo "container_type_desc=NONE below is expected on this host (confirmed locally, #1020) -- it means the engine never detects it is containerized here, which is the likely reason MSSQL_MEMORY_LIMIT_MB has no confirmed effect. The numbers below are what SQL Server itself believes, not proof the Docker-level --memory cap above is honored (that cap is enforced by the kernel regardless of what the engine believes)."
          dotnet run --file "$RUNNER_TEMP/mssql-mem-check.cs"

      - name: Run integration tests
        timeout-minutes: 15
        run: >-
          dotnet test
          test/WalkingTec.Mvvm.Integration.Test/WalkingTec.Mvvm.Integration.Test.csproj
          -c Release
          --filter "TestCategory=Integration"
          --verbosity normal
          --logger "trx;LogFileName=integration-results.trx"
        env:
          # CI-only ephemeral container password — not connected to any persistent resource
          WTM_TEST_MSSQL: "Server=mssql,1433;Database=WtmIntegrationTest;User Id=sa;Password=YourStr0ng!Pass;TrustServerCertificate=True"

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        continue-on-error: true
        timeout-minutes: 5
        with:
          name: integration-test-results
          path: "**/*.trx"
