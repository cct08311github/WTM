name: ClientApp

on:
  pull_request:
    branches: [dotnet10]
    paths:
      - 'demo/WalkingTec.Mvvm.Vue3Demo/ClientApp/**'
      - '.github/workflows/clientapp.yml'
  push:
    branches: [dotnet10]
    paths:
      - 'demo/WalkingTec.Mvvm.Vue3Demo/ClientApp/**'
      - '.github/workflows/clientapp.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: clientapp-${{ github.ref }}
  cancel-in-progress: true

jobs:
  clientapp-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: demo/WalkingTec.Mvvm.Vue3Demo/ClientApp
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: demo/WalkingTec.Mvvm.Vue3Demo/ClientApp/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
