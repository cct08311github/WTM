name: Publish NuGet to GitHub Packages

on:
  workflow_dispatch:
    inputs:
      version_suffix:
        description: 'Optional pre-release suffix (e.g. alpha, beta, rc1). Leave blank for stable.'
        required: false
        default: ''
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      PACKAGE_SOURCE: https://nuget.pkg.github.com/cct08311github/index.json

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Determine package version
        id: version
        env:
          VERSION_SUFFIX: ${{ github.event.inputs.version_suffix }}
        run: |
          BASE=$(grep -oP '(?<=<VersionPrefix>)[^<]+' version.props)
          if [ -n "$VERSION_SUFFIX" ]; then
            echo "version=${BASE}-${VERSION_SUFFIX}" >> $GITHUB_OUTPUT
          else
            echo "version=${BASE}" >> $GITHUB_OUTPUT
          fi

      - name: Pack WalkingTec.Mvvm.Core
        env:
          PKG_VERSION: ${{ steps.version.outputs.version }}
        run: dotnet pack src/WalkingTec.Mvvm.Core/WalkingTec.Mvvm.Core.csproj -c Release -o nupkgs /p:Version=$PKG_VERSION

      - name: Pack WalkingTec.Mvvm.TagHelpers.LayUI
        env:
          PKG_VERSION: ${{ steps.version.outputs.version }}
        run: dotnet pack src/WalkingTec.Mvvm.TagHelpers.LayUI/WalkingTec.Mvvm.TagHelpers.LayUI.csproj -c Release -o nupkgs /p:Version=$PKG_VERSION

      - name: Pack WalkingTec.Mvvm.Mvc
        env:
          PKG_VERSION: ${{ steps.version.outputs.version }}
        run: dotnet pack src/WalkingTec.Mvvm.Mvc/WalkingTec.Mvvm.Mvc.csproj -c Release -o nupkgs /p:Version=$PKG_VERSION

      - name: List packages
        run: ls -lh nupkgs/

      - name: Push to GitHub Packages
        run: |
          dotnet nuget push "nupkgs/*.nupkg" \
            --api-key ${{ secrets.GITHUB_TOKEN }} \
            --source ${{ env.PACKAGE_SOURCE }} \
            --skip-duplicate

      - name: Smoke test package install
        env:
          PKG_VERSION: ${{ steps.version.outputs.version }}
          NUPKG_DIR: ${{ github.workspace }}/nupkgs
        run: |
          set -euo pipefail
          mkdir smoke && cd smoke
          dotnet new console --framework net10.0
          dotnet nuget add source "$NUPKG_DIR" --name local-nupkgs
          dotnet add package WalkingTec.Mvvm.Core --version "$PKG_VERSION" --source "$NUPKG_DIR"
          dotnet add package WalkingTec.Mvvm.Mvc --version "$PKG_VERSION" --source "$NUPKG_DIR"
          dotnet add package WalkingTec.Mvvm.TagHelpers.LayUI --version "$PKG_VERSION" --source "$NUPKG_DIR"
          dotnet restore
          dotnet build -c Release --no-restore

      - name: Upload .nupkg to release assets
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.ref_name }}
        run: gh release upload "$TAG_NAME" nupkgs/*.nupkg --clobber
