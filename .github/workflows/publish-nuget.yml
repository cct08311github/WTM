name: Publish NuGet to GitHub Packages

on:
  workflow_dispatch:
    inputs:
      version_suffix:
        description: 'Optional pre-release suffix (e.g. alpha, beta, rc1). Leave blank for stable.'
        required: false
        default: ''
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      PACKAGE_SOURCE: https://nuget.pkg.github.com/cct08311github/index.json

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Determine package version
        id: version
        env:
          VERSION_SUFFIX: ${{ github.event.inputs.version_suffix }}
        run: |
          BASE=$(grep -oP '(?<=<VersionPrefix>)[^<]+' version.props)
          if [ -n "$VERSION_SUFFIX" ]; then
            echo "version=${BASE}-${VERSION_SUFFIX}" >> $GITHUB_OUTPUT
          else
            echo "version=${BASE}" >> $GITHUB_OUTPUT
          fi

      - name: Pack WalkingTec.Mvvm.Core
        env:
          PKG_VERSION: ${{ steps.version.outputs.version }}
        run: dotnet pack src/WalkingTec.Mvvm.Core/WalkingTec.Mvvm.Core.csproj -c Release -o nupkgs /p:Version=$PKG_VERSION

      - name: Pack WalkingTec.Mvvm.TagHelpers.LayUI
        env:
          PKG_VERSION: ${{ steps.version.outputs.version }}
        run: dotnet pack src/WalkingTec.Mvvm.TagHelpers.LayUI/WalkingTec.Mvvm.TagHelpers.LayUI.csproj -c Release -o nupkgs /p:Version=$PKG_VERSION

      - name: Pack WalkingTec.Mvvm.Mvc
        env:
          PKG_VERSION: ${{ steps.version.outputs.version }}
        run: dotnet pack src/WalkingTec.Mvvm.Mvc/WalkingTec.Mvvm.Mvc.csproj -c Release -o nupkgs /p:Version=$PKG_VERSION

      - name: List packages
        run: ls -lh nupkgs/

      - name: Push to GitHub Packages
        run: |
          dotnet nuget push "nupkgs/*.nupkg" \
            --api-key ${{ secrets.GITHUB_TOKEN }} \
            --source ${{ env.PACKAGE_SOURCE }} \
            --skip-duplicate

      - name: Setup NuGet source for smoke test
        run: |
          dotnet nuget add source "${{ env.PACKAGE_SOURCE }}" \
            --name github-wtm \
            --username "${{ github.actor }}" \
            --password "${{ secrets.GITHUB_TOKEN }}" \
            --store-password-in-clear-text

      - name: Wait for package visibility
        env:
          PKG_VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          attempts=10
          delay=15
          for i in $(seq 1 $attempts); do
            result="$(dotnet package search WalkingTec.Mvvm.Core \
              --source "${{ env.PACKAGE_SOURCE }}" \
              --exact-match \
              --format json)"
            if python3 -c 'import json, sys; payload = json.loads(sys.argv[1] or "{}"); version = sys.argv[2]; raise SystemExit(0 if any(item.get("version") == version for search_result in payload.get("searchResult", []) for package in search_result.get("packages", []) for item in package.get("versions", [])) else 1)' "$result" "$PKG_VERSION"
            then
              echo "Package version $PKG_VERSION is visible in feed."
              exit 0
            fi
            echo "Package version $PKG_VERSION not visible yet (attempt $i/$attempts)."
            sleep "$delay"
          done
          echo "Package version $PKG_VERSION did not become visible in time." >&2
          exit 1

      - name: Smoke test package install
        env:
          PKG_VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          mkdir smoke
          cd smoke
          dotnet new console --framework net8.0
          dotnet add package WalkingTec.Mvvm.Core --version "$PKG_VERSION" --source "${{ env.PACKAGE_SOURCE }}"
          dotnet add package WalkingTec.Mvvm.Mvc --version "$PKG_VERSION" --source "${{ env.PACKAGE_SOURCE }}"
          dotnet add package WalkingTec.Mvvm.TagHelpers.LayUI --version "$PKG_VERSION" --source "${{ env.PACKAGE_SOURCE }}"
          dotnet restore
          dotnet build -c Release --no-restore

      - name: Upload .nupkg to release assets
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.ref_name }}
        run: gh release upload "$TAG_NAME" nupkgs/*.nupkg --clobber
