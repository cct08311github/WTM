name: Publish NuGet to Gitea Packages

on:
  workflow_dispatch:
    inputs:
      version_suffix:
        description: 'Optional pre-release suffix (e.g. alpha, beta, rc1). Leave blank for stable.'
        required: false
        default: ''
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      PACKAGE_SOURCE: https://mac-mini.tailde842d.ts.net/api/packages/chiu0831/nuget/index.json

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Determine package version
        id: version
        env:
          VERSION_SUFFIX: ${{ github.event.inputs.version_suffix }}
        run: |
          BASE=$(grep -oP '(?<=<VersionPrefix>)[^<]+' version.props)
          if [ -n "$VERSION_SUFFIX" ]; then
            echo "version=${BASE}-${VERSION_SUFFIX}" >> $GITHUB_OUTPUT
          else
            echo "version=${BASE}" >> $GITHUB_OUTPUT
          fi

      - name: Pack WalkingTec.Mvvm.Core
        env:
          PKG_VERSION: ${{ steps.version.outputs.version }}
        run: dotnet pack src/WalkingTec.Mvvm.Core/WalkingTec.Mvvm.Core.csproj -c Release -o nupkgs /p:Version=$PKG_VERSION

      - name: Pack WalkingTec.Mvvm.TagHelpers.LayUI
        env:
          PKG_VERSION: ${{ steps.version.outputs.version }}
        run: dotnet pack src/WalkingTec.Mvvm.TagHelpers.LayUI/WalkingTec.Mvvm.TagHelpers.LayUI.csproj -c Release -o nupkgs /p:Version=$PKG_VERSION

      - name: Pack WalkingTec.Mvvm.Mvc
        env:
          PKG_VERSION: ${{ steps.version.outputs.version }}
        run: dotnet pack src/WalkingTec.Mvvm.Mvc/WalkingTec.Mvvm.Mvc.csproj -c Release -o nupkgs /p:Version=$PKG_VERSION

      - name: Pack WalkingTec.Mvvm.WorkFlow
        env:
          PKG_VERSION: ${{ steps.version.outputs.version }}
        run: dotnet pack src/WalkingTec.Mvvm.WorkFlow/WalkingTec.Mvvm.WorkFlow.csproj -c Release -o nupkgs /p:Version=$PKG_VERSION

      - name: Pack WalkingTec.Mvvm.Etl
        env:
          PKG_VERSION: ${{ steps.version.outputs.version }}
        run: dotnet pack src/WalkingTec.Mvvm.Etl/WalkingTec.Mvvm.Etl.csproj -c Release -o nupkgs /p:Version=$PKG_VERSION

      - name: Pack WalkingTec.Mvvm.FileHandlers.S3
        env:
          PKG_VERSION: ${{ steps.version.outputs.version }}
        run: dotnet pack src/WalkingTec.Mvvm.FileHandlers.S3/WalkingTec.Mvvm.FileHandlers.S3.csproj -c Release -o nupkgs /p:Version=$PKG_VERSION

      - name: List packages
        run: ls -lh nupkgs/

      - name: Push to Gitea Packages
        run: |
          dotnet nuget push "nupkgs/*.nupkg" \
            --api-key ${{ secrets.PAT_TOKEN }} \
            --source ${{ env.PACKAGE_SOURCE }} \
            --skip-duplicate

      # ── GitHub mirror sync ─────────────────────────────────────────────────
      # Required secret: GH_MIRROR_PAT — a Personal Access Token for account
      # `cct08311github` with scopes: repo, workflow, write:packages, read:packages.
      # Add it in Gitea repo Settings → Secrets → GH_MIRROR_PAT.
      # (must NOT start with GITHUB_ — Gitea reserves that prefix)
      #
      # These steps run only on real tag pushes (not workflow_dispatch without
      # a tag ref). If any step here fails the job exits non-zero, which means
      # the GitHub sync failed — but the Gitea publish above has already
      # succeeded unconditionally.
      #
      # Security: all github.ref_name / steps.* values are passed through env:
      # vars rather than inline shell interpolation to prevent accidental
      # injection if expression semantics ever change.
      #
      # Leak-gate invariant (#659): the internal-marker scan runs exactly once,
      # unconditionally, immediately before the tree can reach ANY `git push`
      # to the github remote — see "Sync manifest — leak-gate scan" below. The
      # merge-fallback path re-runs the same shared script as a second, final
      # safety net after conflict resolution (a non-conflicting file add from
      # github/dotnet10 is the one thing the pre-push scan can't see). Both
      # invocations share one script materialized in $RUNNER_TEMP so the check
      # can never drift between the two call sites.

      - name: Configure GitHub remote
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_PAT: ${{ secrets.GH_MIRROR_PAT }}
        run: |
          git remote add github \
            "https://x-access-token:${GH_PAT}@github.com/cct08311github/WTM.git"

      # Fail fast if .sync/github-replace.txt has drifted from the required
      # `<source>\t<destination>` format (#659). A space-edited line parses as
      # ONE field under `cut -f1`/`cut -f2` — cut silently returns the whole
      # line for field 1 and empty for field 2, so the replace step's
      # whitespace fallback (awk) masks the typo instead of failing loudly.
      #
      # Only a truly EMPTY line (`/^$/`) is tolerated as a blank separator —
      # matching the replace step's own skip rule below (`case "$line" in
      # '#'*|'') continue ;;`, which also only matches the literal empty
      # string, not `/^[[:space:]]*$/`). A whitespace-only line (e.g. one
      # stray space) is deliberately NOT skipped here: it has no tab, so
      # NF == 1, and it falls through to the NF != 2 check and fails loudly.
      # Skipping it (as an earlier revision of this lint did) would let it
      # reach the replace step instead, where `cut`'s no-tab fallback and
      # the whitespace-split `awk` fallback both collapse it to an empty
      # src/dst and crash `cp -f "" ""`.
      - name: Sync manifest — lint github-replace.txt
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          set -euo pipefail
          awk -F'\t' '
            /^#/ { next }
            /^$/ { next }
            {
              if (NF != 2 || $1 == "" || $2 == "") {
                print "ERROR: line " NR " is not exactly two TAB-separated fields: " $0
                bad = 1
              }
            }
            END { if (bad) exit 1 }
          ' .sync/github-replace.txt

      # ── Apply .sync/ manifest to produce a filtered tree for GitHub ──────────
      # All three steps operate on a temporary local branch `sync-to-github-tmp`
      # so that the Gitea working tree is never modified.  One commit bundles all
      # manifest changes; that commit (not the raw Gitea HEAD) is what gets
      # pushed to GitHub's dotnet10 and tagged.
      # Order matches README.md: replace → exclude → sanitize.

      - name: Sync manifest — create temp branch
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          set -euo pipefail
          git checkout -b sync-to-github-tmp
          git config user.email "ci@wtm-sync"
          git config user.name "WTM Sync Bot"
          # Preserve the sanitize rules before the excludes step deletes .sync/.
          cp .sync/github-sanitize.sed "$RUNNER_TEMP/wtm-sanitize.sed"

          # Materialize the shared leak-gate scan now (before excludes removes
          # .sync/) so both the pre-push step below and the merge-fallback
          # retry can invoke the exact same check. Marker literals are built
          # at runtime from fragments so the bare strings never appear
          # verbatim in this workflow file (which is itself synced to the
          # mirror and passed through github-sanitize.sed like any other
          # tracked .yml file). The unique tailnet segment and full hostname
          # suffix are the true identifiers; github-sanitize.sed rewrites
          # them completely, so any surviving occurrence is a genuine
          # sanitize failure.
          cat > "$RUNNER_TEMP/wtm-leak-gate.sh" <<'LEAKGATE'
          #!/usr/bin/env bash
          set -euo pipefail
          _M="mac""-mini"          # rewrites via full-host rule in .sed
          _G="GITEA""_"            # rewrites via \bGITEA_TOKEN/HOST/USER\b rules
          _T="tailde842d"          # rewrites: s|tailde842d|internal-tailnet|g
          _N="\.ts\.net"           # rewrites as part of full-host rule in .sed
          BAD=$(git grep -lI \
            -e "$_M" \
            -e "$_T" \
            -e "$_G" \
            -e "$_N" \
            -- ':!.sync/' ':!.github/workflows/' 2>/dev/null || true)
          if [ -n "$BAD" ]; then
            echo "ERROR: leak-gate triggered — internal markers found in:"
            echo "$BAD"
            exit 1
          fi
          echo "leak-gate: no internal markers found in tracked tree."
          LEAKGATE
          chmod +x "$RUNNER_TEMP/wtm-leak-gate.sh"

      - name: Sync manifest — apply github-replace.txt
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          set -euo pipefail
          # For each non-comment, non-empty line: copy source → dest, remove source.
          # Format is tab-separated; fall back to first-whitespace split for safety.
          while IFS= read -r line; do
            case "$line" in '#'*|'') continue ;; esac
            src=$(printf '%s' "$line" | cut -f1)
            dst=$(printf '%s' "$line" | cut -f2)
            if [ -z "$dst" ] || [ "$src" = "$dst" ]; then
              # Whitespace fallback (no tab present).
              src=$(printf '%s' "$line" | awk '{print $1}')
              dst=$(printf '%s' "$line" | awk '{print $2}')
            fi
            echo "replace: cp -f ${src} -> ${dst}, rm ${src}"
            cp -f "$src" "$dst"
            git rm -f "$src"
          done < .sync/github-replace.txt
          git add -A

      - name: Sync manifest — apply github-excludes.txt
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          set -euo pipefail
          while IFS= read -r path; do
            case "$path" in '#'*|'') continue ;; esac
            echo "exclude: ${path}"
            if [[ "$path" == */ ]]; then
              git rm -rf "$path" || true
            else
              git rm -f "$path" || true
            fi
          done < .sync/github-excludes.txt

      - name: Sync manifest — apply github-sanitize.sed and commit
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          set -euo pipefail
          # Run sed in-place over every git-tracked file that is text (post
          # replace/exclude), not a fixed extension allowlist (#659) — a new
          # file type (.ts, .txt, …) must never silently bypass sanitization.
          #
          # `git grep -zIl -e '' -- .` enumerates matching filenames in a
          # SINGLE process, NUL-terminated (`-z`), and `-I` skips binaries
          # exactly like the leak-gate's own `git grep -I` does below, so
          # both passes agree on what counts as "text". This repo has
          # tracked filenames containing literal spaces (two ClientApp demo
          # files under demo/WalkingTec.Mvvm.ReactDemo/) — an earlier
          # revision piped `grep -Il` (newline-delimited, unquoted output)
          # into a plain `xargs sed -i` (word-splits on whitespace), which
          # is NUL-safe only at the first hop and deterministically failed
          # ("sed: can't read ...", exit 123) the moment this tree-wide scan
          # (vs. the old extension allowlist, which never matched those two
          # files) reached them. `-z` + the paired `xargs -0` below keep the
          # hand-off NUL-safe end to end.
          #
          # Single-process enumeration also sidesteps a latent pipefail
          # fragility: piping `git ls-files -z` through `xargs -0 grep` lets
          # xargs split ~5200 filenames into several `grep` invocations: any
          # one batch with zero matches (or an unreadable file) makes that
          # invocation exit 1 (or 2), which xargs turns into exit 123 for
          # the whole stage — failing the release under `set -o pipefail`
          # even though nothing is actually wrong. `git grep` scans the
          # whole tree in one process, so no such batch exists; the `|| true`
          # only guards the one remaining edge case (zero matching text
          # files in the entire tree), where `git grep -l` itself exits 1.
          # No `2>/dev/null` here — genuine errors must stay visible in the
          # CI log, not be silently swallowed.
          { git grep -zIl -e '' -- . || true; } | \
            xargs -0 -r sed -i -f "$RUNNER_TEMP/wtm-sanitize.sed"
          git add -A
          # Bundle all manifest changes into a single commit.
          git diff --cached --quiet || \
            git commit -m "chore(sync): apply github mirror manifest"

      # Leak-gate: scan the fully sanitized, committed tree BEFORE the first
      # push attempt (#659). This is the step that closes the fast-forward
      # gap — previously the scan only ran inside the merge-fallback branch
      # below, so a clean fast-forward push shipped with no final marker scan
      # at all.
      - name: Sync manifest — leak-gate scan
        if: startsWith(github.ref, 'refs/tags/')
        run: bash "$RUNNER_TEMP/wtm-leak-gate.sh"

      - name: Push dotnet10 branch to GitHub
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          set -euo pipefail
          git fetch github --no-tags 2>/dev/null || true
          # Try fast-forward first (pushing filtered sync branch HEAD as dotnet10).
          if git push github HEAD:refs/heads/dotnet10; then
            echo "Fast-forward push succeeded."
          else
            echo "Non-fast-forward detected; attempting merge (Gitea is authoritative — -X ours)."
            git fetch github dotnet10
            # -X ours resolves content conflicts but leaves modify/delete conflicts
            # unresolved (merge exits non-zero). We handle those explicitly below.
            git merge github/dotnet10 \
              -X ours \
              --allow-unrelated-histories \
              -m "merge: sync Gitea release to GitHub (auto-resolve excludes)" \
              --no-edit || MERGE_EXIT=$?

            # Resolve any remaining modify/delete conflicts deterministically.
            # Gitea/HEAD is authoritative: files deleted here (excluded from mirror)
            # stay deleted; files deleted on the mirror but present here stay present.
            UNMERGED=$(git ls-files -u | wc -l | tr -d ' ')
            if [ "${UNMERGED}" -gt 0 ]; then
              echo "Resolving ${UNMERGED} unmerged index entries (modify/delete conflicts)."

              # DU = deleted by us (HEAD deleted, mirror modified) → keep deletion.
              git status --porcelain | awk '/^DU /{print $2}' | while IFS= read -r f; do
                echo "  DU (excluded): removing ${f}"
                git rm -f -- "$f"
              done

              # UD = deleted by them (mirror deleted, HEAD has it) → keep HEAD version.
              git status --porcelain | awk '/^UD /{print $2}' | while IFS= read -r f; do
                echo "  UD (keep HEAD): restoring ${f}"
                git checkout --ours -- "$f"
                git add -- "$f"
              done

              # Any remaining AA/UU content conflicts: keep ours.
              git diff --name-only --diff-filter=U | while IFS= read -r f; do
                echo "  UU (content): keeping HEAD for ${f}"
                git checkout --ours -- "$f"
                git add -- "$f"
              done

              # Verify all conflicts resolved before committing.
              STILL_UNMERGED=$(git ls-files -u | wc -l | tr -d ' ')
              if [ "${STILL_UNMERGED}" -gt 0 ]; then
                echo "ERROR: ${STILL_UNMERGED} unresolved conflict(s) remain after auto-resolution:"
                git ls-files -u | head -20
                exit 1
              fi

              git commit --no-edit \
                -m "merge: sync Gitea release to GitHub (auto-resolve excludes)"
            fi

            # Leak-gate: re-scan after merge resolution (#659), using the same
            # shared script as the pre-push scan above. Resolution always
            # keeps HEAD, which is the sanitized sync tree, so this is a
            # final safety net against a non-conflicting file add from
            # github/dotnet10 introducing content the earlier pre-push scan
            # never had a chance to see.
            bash "$RUNNER_TEMP/wtm-leak-gate.sh"

            # Retry push after merge resolution.
            if ! git push github HEAD:refs/heads/dotnet10; then
              echo "ERROR: push to GitHub dotnet10 failed even after merge. Aborting."
              exit 1
            fi
          fi

      - name: Push release tag to GitHub
        if: startsWith(github.ref, 'refs/tags/')
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # Re-tag at the filtered sync commit so GitHub's tag SHA matches what
          # GitHub has in its dotnet10 history (not the raw Gitea commit).
          git tag -f "$TAG" HEAD
          git push github "$TAG" --force

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_PAT: ${{ secrets.GH_MIRROR_PAT }}
          TAG: ${{ github.ref_name }}
          PKG_VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail

          # Extract the CHANGELOG section for this version as the release body.
          # Matches "## [<version>]" through the next "## [" heading.
          BODY=$(awk \
            "/^## \[${PKG_VERSION}\]/{found=1; next} found && /^## \[/{exit} found{print}" \
            CHANGELOG.md | sed '/^[[:space:]]*$/{ H; d; }; x; /./!d; x; s/^\n//')

          if [ -z "$BODY" ]; then
            BODY="Release ${TAG}"
          fi

          # Escape body for JSON without requiring jq.
          BODY_JSON=$(python3 -c "
          import sys, json
          body = open('/dev/stdin').read()
          print(json.dumps(body))
          " <<< "$BODY")

          PAYLOAD="{\"tag_name\":\"${TAG}\",\"name\":\"${TAG}\",\"body\":${BODY_JSON},\"draft\":false,\"prerelease\":false}"

          # Idempotent release creation: GET existing release → PATCH if found, POST if not.
          # curl -sS (no -f) so a 404 is captured rather than aborting with set -e.
          GET_RESPONSE=$(curl -sS -w "\n%{http_code}" \
            -H "Authorization: Bearer ${GH_PAT}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/cct08311github/WTM/releases/tags/${TAG}")

          GET_HTTP_CODE=$(printf '%s' "$GET_RESPONSE" | tail -n1)
          GET_BODY=$(printf '%s' "$GET_RESPONSE" | head -n -1)

          RELEASE_ID=$(python3 -c "
          import sys, json
          body = sys.stdin.read()
          try:
              data = json.loads(body)
              print(data.get('id', ''))
          except Exception:
              print('')
          " <<< "$GET_BODY")

          if [ -n "$RELEASE_ID" ] && [ "$RELEASE_ID" != "None" ]; then
            echo "Release already exists (id=${RELEASE_ID}), updating via PATCH..."
            curl -fsSL \
              -X PATCH \
              -H "Authorization: Bearer ${GH_PAT}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/cct08311github/WTM/releases/${RELEASE_ID}" \
              -d "$PAYLOAD"
          else
            echo "No existing release found (HTTP ${GET_HTTP_CODE}), creating via POST..."
            curl -fsSL \
              -X POST \
              -H "Authorization: Bearer ${GH_PAT}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/cct08311github/WTM/releases" \
              -d "$PAYLOAD"
          fi

      # Re-pack from the sanitized source tree so the published nuspec contains
      # `internal.registry.invalid` instead of the internal tailnet hostname.
      # At this point the working tree is still on sync-to-github-tmp with
      # common.props already rewritten by github-sanitize.sed.
      - name: Re-pack from sanitized source for GitHub Packages
        if: startsWith(github.ref, 'refs/tags/')
        env:
          PKG_VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p nupkgs-github
          dotnet pack src/WalkingTec.Mvvm.Core/WalkingTec.Mvvm.Core.csproj                             -c Release -o nupkgs-github /p:Version=$PKG_VERSION
          dotnet pack src/WalkingTec.Mvvm.TagHelpers.LayUI/WalkingTec.Mvvm.TagHelpers.LayUI.csproj -c Release -o nupkgs-github /p:Version=$PKG_VERSION
          dotnet pack src/WalkingTec.Mvvm.Mvc/WalkingTec.Mvvm.Mvc.csproj                              -c Release -o nupkgs-github /p:Version=$PKG_VERSION
          dotnet pack src/WalkingTec.Mvvm.WorkFlow/WalkingTec.Mvvm.WorkFlow.csproj                    -c Release -o nupkgs-github /p:Version=$PKG_VERSION
          dotnet pack src/WalkingTec.Mvvm.Etl/WalkingTec.Mvvm.Etl.csproj                              -c Release -o nupkgs-github /p:Version=$PKG_VERSION
          dotnet pack src/WalkingTec.Mvvm.FileHandlers.S3/WalkingTec.Mvvm.FileHandlers.S3.csproj      -c Release -o nupkgs-github /p:Version=$PKG_VERSION
          # Sanity-check: the sanitized placeholder MUST be present in EVERY nuspec.
          # Loop over each .nupkg individually — passing a glob to unzip treats the
          # first file as the archive and the rest as member-name filters, so without
          # this loop only the first package would be checked.
          for pkg in nupkgs-github/*.nupkg; do
            if ! unzip -p "$pkg" '*.nuspec' 2>/dev/null | grep -q 'internal\.registry\.invalid'; then
              echo "ERROR: sanitized RepositoryUrl missing from $(basename "$pkg") nuspec — sanitize may have failed; aborting." >&2
              exit 1
            fi
          done
          echo "Sanitized nupkgs ready:"
          ls -lh nupkgs-github/

      - name: Push NuGet packages to GitHub Packages
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_PAT: ${{ secrets.GH_MIRROR_PAT }}
        run: |
          dotnet nuget push "nupkgs-github/*.nupkg" \
            --api-key "$GH_PAT" \
            --source "https://nuget.pkg.github.com/cct08311github/index.json" \
            --skip-duplicate

      # ── Smoke test (runs after both Gitea and GitHub publish stages) ────────

      - name: Smoke test package install
        env:
          PKG_VERSION: ${{ steps.version.outputs.version }}
          NUPKG_DIR: ${{ github.workspace }}/nupkgs
        run: |
          set -euo pipefail
          mkdir smoke && cd smoke
          dotnet new console --framework net10.0
          dotnet nuget add source "$NUPKG_DIR" --name local-nupkgs
          dotnet add package WalkingTec.Mvvm.Core --version "$PKG_VERSION"
          dotnet add package WalkingTec.Mvvm.Mvc --version "$PKG_VERSION"
          dotnet add package WalkingTec.Mvvm.TagHelpers.LayUI --version "$PKG_VERSION"
          dotnet add package WalkingTec.Mvvm.WorkFlow --version "$PKG_VERSION"
          dotnet restore
          dotnet build -c Release --no-restore
