# Local development services for WTM.
#
# Primary use case: running the WalkingTec.Mvvm.Integration.Test suite
# against a real SQL Server, mirroring the CI environment
# (.github/workflows/integration-test.yml).
#
# Bring up:
#   docker compose up -d mssql
#
# Run integration tests:
#   dotnet test test/WalkingTec.Mvvm.Integration.Test -c Release
#
# Tear down (deletes data):
#   docker compose down -v
#
# Note: credentials here match the CI workflow defaults — the container is
# ephemeral and never connected to a persistent resource. Override via
# WTM_TEST_MSSQL if you prefer a different password.

services:
  mssql:
    # Issue #767/#773: mcr.microsoft.com/mssql/server is x64-only and crashes
    # under QEMU on Apple Silicon. azure-sql-edge ships linux/arm64 natively
    # and is what CI uses (.github/workflows/integration-test.yml).
    image: mcr.microsoft.com/azure-sql-edge:latest
    container_name: wtm-mssql
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "YourStr0ng!Pass"
      MSSQL_PID: "Developer"
    ports:
      - "1433:1433"
    healthcheck:
      # azure-sql-edge ships no sqlcmd; confirm TCP accept instead
      # (bash -c because /dev/tcp is a bashism, not POSIX sh).
      test:
        [
          "CMD-SHELL",
          "bash -c '(echo > /dev/tcp/127.0.0.1/1433) 2>/dev/null' || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
